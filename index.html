<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>正字台</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --card3:#EDEDF0;
  --text:#1C1C1E; --text2:#8A8A8E; --text3:#C4C4C8;
  --sep:rgba(60,60,67,.08); --cell:#EFEFF4; --cell2:#E5E5EA;
  --accent:#5B7183; --nav:rgba(242,242,247,.82);
  --sheet:#FFFFFF; --ink:#1B1B1D; --danger:#C9564B;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --tabbar:rgba(242,242,247,.94);
  --paper:#FAF8F3;
  --ink-soft:#2A2622;
  --seal:#B14B3A;
}
html[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#242427; --card3:#2A2A2E;
  --text:#FFFFFF; --text2:#98989E; --text3:#5A5A60;
  --sep:rgba(84,84,88,.5); --cell:#2A2A2E; --cell2:#333338;
  --accent:#93A9BC; --nav:rgba(20,20,22,.78);
  --sheet:#1C1C1E; --ink:#EDEAE4; --danger:#E06A5E;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  --tabbar:rgba(20,20,22,.94);
  --paper:#1A1815;
  --ink-soft:#E8E2D6;
  --seal:#C9564B;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#000000; --card:#1C1C1E; --card2:#242427; --card3:#2A2A2E;
    --text:#FFFFFF; --text2:#98989E; --text3:#5A5A60;
    --sep:rgba(84,84,88,.5); --cell:#2A2A2E; --cell2:#333338;
    --accent:#93A9BC; --nav:rgba(20,20,22,.78);
    --sheet:#1C1C1E; --ink:#EDEAE4; --danger:#E06A5E;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
    --tabbar:rgba(20,20,22,.94);
    --paper:#1A1815;
    --ink-soft:#E8E2D6;
    --seal:#C9564B;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  transition:background .3s,color .3s;
}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;}

/* 顶部导航 */
.nav{
  position:sticky;top:0;z-index:20;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 6px;
  border-bottom:.5px solid transparent;
  transition:border-color .25s;
}
.nav.scrolled{border-bottom-color:var(--sep);}
.nav-row{display:flex;align-items:center;justify-content:space-between;height:40px;}
.app-title{
  font-size:20px;font-weight:700;letter-spacing:.5px;margin:0;
  color:var(--text);padding:0;
}
.nav-actions{display:flex;gap:2px;}
.icon-btn{
  width:40px;height:40px;border-radius:20px;border:none;background:transparent;
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .18s;
}
.icon-btn:active{background:var(--sep);}
.icon-btn svg{width:22px;height:22px;}

/* 页面 */
.page-content{
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.page-content.hide{display:none;}

/* 日期行 */
.date-bar{
  display:flex;align-items:center;justify-content:center;
  padding:8px 16px 10px;gap:4px;
}
.date-arrow{
  width:34px;height:34px;border-radius:17px;border:none;background:transparent;
  color:var(--accent);font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
}
.date-arrow:active{background:var(--sep);}
.date-text{
  font-size:14.5px;font-weight:500;letter-spacing:.2px;
  min-width:200px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.date-text .dim{color:var(--text2);font-weight:400;margin-left:4px;}
.today-btn{
  border:none;background:transparent;color:var(--accent);
  font-size:12.5px;font-family:inherit;padding:4px 8px;
  cursor:pointer;letter-spacing:.2px;border-radius:8px;
}
.today-btn:active{background:var(--sep);}
.today-btn.hide{display:none;}

/* 卡片 */
.list{padding:0 16px 16px;}
.card{
  position:relative;background:var(--card);border-radius:20px;
  padding:14px 16px 16px;margin-bottom:11px;
  transition:box-shadow .3s,background .25s;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.card.open{box-shadow:var(--shadow);}
.card.done{background:color-mix(in srgb,var(--c) 8%,var(--card));}

.card-head{display:flex;align-items:center;gap:10px;}
.dot{
  width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent);
}
.names{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:6px;}
.pname{
  font-size:17px;font-weight:600;letter-spacing:.2px;margin:0;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tri{
  width:10px;height:10px;color:var(--text3);flex:none;
  transition:transform .3s;
}
.card.open .tri{transform:rotate(180deg);}
.streak{
  font-size:12px;color:var(--text2);letter-spacing:.2px;
  font-variant-numeric:tabular-nums;flex:none;
}
.streak.hide{display:none;}
.head-edit{
  display:none;border:none;background:none;color:var(--text3);
  font-size:12.5px;letter-spacing:.2px;font-family:inherit;
  padding:4px 0;cursor:pointer;flex:none;
}
.head-edit:active{opacity:.5;}
.card.open .head-edit{display:block;}

/* 记一笔 / 补一笔 / 已记 按钮 */
.card-btn{
  flex:none;border:none;font-family:inherit;font-size:13px;
  padding:7px 14px;border-radius:16px;cursor:pointer;
  letter-spacing:.4px;font-weight:500;
  transition:transform .14s,background .2s,color .2s;
  white-space:nowrap;
}
.card-btn:active{transform:scale(.94);}
.card-btn.record{background:var(--c);color:#fff;}
.card-btn.record.dark-text{color:#2A2A2E;}
.card-btn.done{background:var(--cell);color:var(--text3);font-weight:400;}
.card.open .card-btn{display:none;}

/* 正字行 */
.zrows{margin-top:12px;cursor:pointer;}
.zrow{display:flex;align-items:center;gap:9px;min-height:22px;}
.zrow+.zrow{margin-top:5px;}
.zlabel{font-size:11px;color:var(--text3);width:26px;flex:none;letter-spacing:.5px;}
.zglyphs{display:flex;flex-wrap:wrap;gap:0;flex:1;min-width:0;align-items:center;}
.zglyphs svg{width:19px;height:19px;display:block;flex:none;}
.zglyphs .zmore{font-size:11px;color:var(--text3);margin-left:2px;}
.znum{
  font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;
  flex:none;letter-spacing:.3px;
}

.expand{height:0;overflow:hidden;transition:height .35s cubic-bezier(.32,.72,0,1);}
.expand-inner{overflow:hidden;}

/* 全量正字 */
.full-tian{
  padding-top:14px;border-top:.5px solid var(--sep);margin-top:14px;
}
.full-tian-label{
  font-size:11px;color:var(--text3);letter-spacing:.5px;margin-bottom:8px;
}
.full-tian-glyphs{
  display:flex;flex-wrap:wrap;gap:0;
  max-height:80px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);
}
.full-tian-glyphs svg{width:19px;height:19px;display:block;flex:none;}

/* 月历 */
.cal-wrap{padding-top:14px;}
.cal-head{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-bottom:10px;position:relative;
}
.cal-month{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.4px;min-width:96px;text-align:center;}
.cal-stat{
  font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;
  position:absolute;right:0;
}
.cal-nav{
  width:36px;height:36px;border-radius:18px;border:none;
  background:transparent;color:var(--accent);font-size:20px;
  line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
}
.cal-nav:active{background:var(--sep);}
.weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;
}
.weekdays span{
  text-align:center;font-size:10.5px;color:var(--text3);letter-spacing:.5px;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  width:100%;
}
.cell{
  aspect-ratio:1;border-radius:10px;background:var(--cell);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;transition:background .18s,transform .14s;
  cursor:pointer;overflow:hidden;
}
.cell:active{transform:scale(.92);}
.cell.blank{background:transparent;pointer-events:none;}
.cell .d{font-size:14.5px;line-height:1;color:var(--text2);font-weight:400;font-variant-numeric:tabular-nums;}
.cell .l{font-size:8px;line-height:1;margin-top:2px;color:var(--text3);transform:scale(.92);}
.cell .l.hol{color:var(--danger);}
.cell.today{box-shadow:inset 0 0 0 1.6px var(--c);}
.cell.today .d{color:var(--c);font-weight:600;}
.cell.on{background:var(--c);}
.cell.on .d{color:#fff;font-weight:500;}
.cell.on .l{color:rgba(255,255,255,.72);}
.cell.on .l.hol{color:rgba(255,255,255,.92);}
.cell.on.dark .d{color:#2A2A2E;}
.cell.on.dark .l{color:rgba(42,42,46,.6);}
.cell.on.dark .l.hol{color:rgba(42,42,46,.85);}
.cell.today.on{box-shadow:none;}
.cell.future{border:1.5px dashed var(--cell2);}
.cell.future.on{opacity:.35;border:none;}
.cell .nd{
  position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;
  background:currentColor;opacity:.7;
}
.cell.on .nd{background:#fff;opacity:.85;}

.cal-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep);
  font-size:12px;color:var(--text2);
}
.cal-foot b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}

/* 标签统计 */
.tag-stat{
  padding-top:14px;margin-top:14px;border-top:.5px solid var(--sep);
}
.tag-stat-label{
  font-size:11px;color:var(--text3);letter-spacing:.5px;margin-bottom:8px;
}
.tag-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;padding:4px 0;color:var(--text);
}
.tag-row .tag-val{color:var(--text2);font-variant-numeric:tabular-nums;}

/* 新建项目 */
.add-card{
  width:100%;border:none;background:transparent;color:var(--text3);
  border-radius:20px;padding:18px;font-size:14.5px;letter-spacing:.4px;
  border:1.5px dashed var(--cell2);cursor:pointer;transition:all .2s;
  font-family:inherit;
}
.add-card:active{transform:scale(.985);color:var(--accent);border-color:var(--accent);}

.empty{
  text-align:center;padding:60px 20px;color:var(--text2);
}
.empty .big{font-size:38px;margin-bottom:14px;color:var(--text3);font-weight:300;}
.empty p{font-size:14px;line-height:1.7;margin:0;}

/* 遮罩 + 弹窗 */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;
  opacity:0;transition:opacity .3s;backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.mask.show{opacity:1;}

.modal{
  position:fixed;left:50%;top:50%;z-index:101;
  transform:translate(-50%,-50%) scale(.96);opacity:0;
  width:calc(100% - 48px);max-width:420px;
  max-height:82vh;overflow-y:auto;
  background:var(--sheet);border-radius:20px;
  padding:22px 20px;
  transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .28s;
  -webkit-overflow-scrolling:touch;
}
.modal.show{transform:translate(-50%,-50%) scale(1);opacity:1;}

.modal-title{font-size:18px;font-weight:600;letter-spacing:.3px;margin:0 0 4px;}
.modal-sub{font-size:12.5px;color:var(--text2);margin-bottom:16px;letter-spacing:.2px;}

.form-row{margin-bottom:14px;}
.form-label{font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:.4px;}
.form-hint{font-size:11.5px;color:var(--text3);margin-top:6px;letter-spacing:.2px;line-height:1.5;}
.form-input{
  width:100%;padding:11px 14px;border-radius:12px;
  border:1.5px solid var(--cell2);background:var(--card2);
  color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s,background .2s;
}
.form-input:focus{border-color:var(--accent);background:var(--card);}
textarea.form-input{min-height:100px;line-height:1.6;resize:none;font-family:inherit;}

/* 数字输入 + 正负按钮 */
.num-row{display:flex;gap:8px;align-items:stretch;}
.num-row .form-input{flex:1;font-size:20px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;}
.sign-btn{
  width:52px;border:1.5px solid var(--cell2);background:var(--card2);
  border-radius:12px;font-size:22px;color:var(--accent);
  font-family:inherit;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.sign-btn:active{background:var(--cell);}
.sign-btn.minus{color:var(--danger);}

/* 色板 */
.swatches{
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
  margin-bottom:16px;
}
.sw{
  aspect-ratio:1;border-radius:50%;border:2.5px solid transparent;
  cursor:pointer;position:relative;transition:transform .18s;padding:0;
}
.sw:active{transform:scale(.9);}
.sw.on{border-color:var(--text);}
.sw.on::after{
  content:'';position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.1);
}

/* 单位 chips */
.unit-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.unit-chip{
  padding:5px 11px;border-radius:14px;background:var(--cell);
  color:var(--text2);font-size:12.5px;letter-spacing:.2px;
  cursor:pointer;border:none;font-family:inherit;
  transition:transform .14s,background .14s;
}
.unit-chip:active{transform:scale(.94);background:var(--cell2);}

/* 标签 chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px;}
.chip{
  padding:7px 13px;border-radius:16px;background:var(--cell);
  color:var(--text2);font-size:13px;letter-spacing:.2px;
  cursor:pointer;border:none;font-family:inherit;
  transition:transform .16s,background .16s;
}
.chip:active{transform:scale(.94);background:var(--cell2);}

.modal-actions{display:flex;gap:10px;margin-top:18px;}
.btn{
  flex:1;padding:13px;border-radius:13px;border:none;
  font-size:15px;font-weight:500;letter-spacing:.3px;
  font-family:inherit;cursor:pointer;
  transition:transform .16s,opacity .2s;
}
.btn:active{transform:scale(.97);opacity:.85;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.ghost{background:var(--cell);color:var(--text);}
.btn.danger{background:transparent;color:var(--danger);}

/* 页面（二级） */
.page{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  transform:translateX(100%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.page.show{transform:none;}
.page-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);flex:none;
}
.back-btn{
  border:none;background:none;color:var(--accent);font-size:16px;
  font-family:inherit;padding:4px 0;cursor:pointer;
  display:flex;align-items:center;gap:2px;letter-spacing:.2px;
}
.back-btn:active{opacity:.5;}
.back-btn svg{width:17px;height:17px;}
.page-title{font-size:17px;font-weight:600;letter-spacing:.3px;}

.switch{
  width:51px;height:31px;border-radius:16px;background:var(--cell2);
  position:relative;transition:background .25s;flex:none;
  cursor:pointer;border:none;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);
  transition:transform .25s cubic-bezier(.32,.72,0,1);
}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(20px);}

/* 底部标签栏 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--tabbar);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.tabbar.hide{transform:translateY(100%);}
.tab-item{
  flex:1;border:none;background:none;font-family:inherit;
  padding:8px 0 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text3);transition:color .18s;
}
.tab-item.on{color:var(--accent);}
.tab-item svg{width:24px;height:24px;}
.tab-item span{font-size:10.5px;letter-spacing:.2px;}

/* 月历页面 */
.mode-toggle{
  display:flex;background:var(--cell);border-radius:9px;padding:2px;gap:2px;
}
.mode-toggle button{
  border:none;background:transparent;color:var(--text);font-size:12.5px;
  padding:6px 12px;border-radius:7px;font-family:inherit;cursor:pointer;
  transition:background .2s;letter-spacing:.2px;
}
.mode-toggle button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500;}

.field{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(40px + env(safe-area-inset-bottom));
}

/* 月历大格子 */
.big-cal .cell{aspect-ratio:1;}
.big-cal .cell .d{font-size:12px;margin-bottom:2px;}
.big-cal .cell .tian-mini{width:100%;display:flex;justify-content:center;}
.big-cal .cell .tian-mini svg{width:22px;height:22px;}
.big-cal .cell .stripes{
  display:flex;flex-direction:column;gap:1.5px;width:100%;padding:0 2px;
  overflow:hidden;
}
.big-cal .cell .stripe{
  height:4px;border-radius:2px;width:100%;position:relative;
}
.big-cal .cell .stripe-txt{
  font-size:7px;line-height:4px;color:#fff;text-align:center;
  white-space:nowrap;overflow:hidden;letter-spacing:0;
  position:absolute;inset:0;
}
.big-cal .cell .more-num{
  font-size:7px;color:var(--text3);text-align:right;line-height:1;
  margin-top:1px;
}

/* 进度条 */
.progress-bar{
  height:8px;border-radius:4px;background:var(--cell);
  overflow:hidden;margin-top:8px;
}
.progress-bar i{
  display:block;height:100%;border-radius:4px;background:var(--c);
  transition:width .5s cubic-bezier(.32,.72,0,1);
}
.progress-bar.done i{background:#C9A961;}

.progress-num{
  font-size:22px;font-weight:700;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums;
}
.progress-unit{font-size:14px;color:var(--text2);font-weight:400;margin-left:4px;}

/* 记录列表 */
.rec-list{margin-top:0;}
.rec-month{
  font-size:12px;color:var(--text3);letter-spacing:.5px;
  margin:18px 0 6px;font-weight:500;
}
.rec-month:first-child{margin-top:0;}
.rec-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 0;border-bottom:.5px solid var(--sep);
  font-size:13.5px;
}
.rec-row:last-child{border-bottom:none;}
.rec-left{display:flex;gap:10px;align-items:baseline;}
.rec-date{color:var(--text2);font-variant-numeric:tabular-nums;min-width:56px;}
.rec-tag{color:var(--text);}
.rec-num{font-variant-numeric:tabular-nums;font-weight:500;}
.rec-num.plus{color:var(--accent);}
.rec-num.minus{color:var(--danger);}
.rec-total{color:var(--text3);font-size:12px;font-variant-numeric:tabular-nums;}

/* 设置页 */
.group{
  background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:18px;
}
.group-title{
  font-size:12.5px;color:var(--text2);letter-spacing:.8px;
  padding:0 4px 8px;font-weight:500;
}
.row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;min-height:48px;gap:12px;
}
.row+.row{border-top:.5px solid var(--sep);}
.row-label{font-size:15.5px;letter-spacing:.2px;}
.row-sub{font-size:12px;color:var(--text2);margin-top:2px;letter-spacing:.2px;}
.row-val{font-size:15px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.seg{display:flex;background:var(--cell);border-radius:9px;padding:2px;gap:2px;}
.seg button{
  border:none;background:transparent;color:var(--text);font-size:13px;
  padding:6px 12px;border-radius:7px;font-family:inherit;cursor:pointer;
  transition:background .2s;letter-spacing:.2px;
}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500;}

/* 正字田 */
.tian-page{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:30px 20px calc(60px + env(safe-area-inset-bottom));
  background:var(--paper);
}
.tian-grid{
  display:flex;flex-wrap:wrap;gap:0;
  justify-content:center;
  margin-bottom:40px;
}
.tian-grid svg{width:22px;height:22px;display:block;flex:none;}
.tian-stats{
  text-align:center;color:var(--ink-soft);
}
.tian-stats .num{
  font-size:26px;font-weight:600;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums;
}
.tian-stats .lbl{
  font-size:13px;color:var(--text2);margin-top:6px;letter-spacing:.4px;
}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:rgba(30,30,32,.9);color:#fff;font-size:13px;
  padding:10px 20px;border-radius:20px;z-index:500;
  transition:opacity .3s,transform .3s;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* 首屏提示（浮出） */
.coach{
  position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:rgba(30,30,32,.9);color:#fff;font-size:13px;
  padding:10px 18px;border-radius:20px;z-index:400;
  transition:opacity .35s,transform .35s;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.coach.show{opacity:1;transform:translate(-50%,0);}

<script>/* ============================================================

const STORAGE_KEY = 'zhengzitai.v1';
const COLORS = ['#6FA3A0','#7A93B8','#A98BB0','#C08A7E','#C2A46B','#85A085','#8794A8','#B8735E','#8A9A6B','#B98A94'];

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pad2 = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dateKey = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;
const todayKey = () => { const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); };

function luminance(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
function rgba(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function fmtNum(n){
  if(Number.isInteger(n)) return String(n);
  return String(Math.round(n * 100) / 100);
}
function fmtMoney(n){
  if(Math.abs(n) >= 10000) return (n/10000).toFixed(2) + '万';
  return n.toLocaleString('zh-CN');
}

/* ---------- 默认数据 ---------- */
const DEFAULT_STATE = {
  name: '正字台',
  settings: {
    theme: 'auto',
    lunar: true,
    holiday: true,
    calMode: 'stripe',
    hintRecorded: false,
    hintCalendar: false,
    hintTags: false,
    hintBackup: false,
    chips: ['今天状态不错','有点累','专注了 __ 分钟','读完 __ 页','跑了 __ 公里','心情：','明天想：']
  },
  projects: [],   /* 坚持 */
  progress: [],   /* 进度 */
  trash: []
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const merged = Object.assign(clone(DEFAULT_STATE), parsed, {
        settings: Object.assign(clone(DEFAULT_STATE.settings), parsed.settings || {})
      });
      if(!Array.isArray(merged.progress)) merged.progress = [];
      return merged;
    }
  }catch(e){}
  const s = clone(DEFAULT_STATE);
  /* 不预置示例，首屏为空 */
  return s;
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- 坚持项目 ---------- */
function findProject(id){ return state.projects.find(p => p.id === id); }
function addProject(name, color){
  const p = { id: uid(), name: name || '未命名', color: color || COLORS[state.projects.length % COLORS.length], records: {} };
  state.projects.push(p); saveState(); return p;
}
function updateProject(id, patch){ const p = findProject(id); if(!p) return null; Object.assign(p, patch); saveState(); return p; }
function removeProject(id){
  const p = findProject(id); if(!p) return;
  state.trash.push({ kind:'project', data: clone(p), deletedAt: Date.now() });
  state.projects = state.projects.filter(x => x.id !== id);
  saveState();
}

/* ---------- 记录读写（坚持） ---------- */
function getRecord(project, key){ return project.records[key] || null; }
function hasRecord(project, key){ return !!project.records[key]; }
function setRecord(project, key){
  if(project.records[key]) return;
  project.records[key] = { t: Date.now(), note: '', tag: '' };
  saveState();
}
function removeRecord(project, key){ if(!project.records[key]) return; delete project.records[key]; saveState(); }
function setNote(project, key, note){ if(!project.records[key]) return; project.records[key].note = note; saveState(); }
function setTag(project, key, tag){
  if(!project.records[key]) return;
  project.records[key].tag = tag;
  saveState();
}

/* ---------- 计算（坚持） ---------- */
function countMonth(project, year, month){
  const pre = `${year}-${pad2(month+1)}-`;
  let n = 0;
  for(const k in project.records) if(k.startsWith(pre)) n++;
  return n;
}
function countTotal(project){ return Object.keys(project.records).length; }
function streakOf(project){
  let n = 0;
  const t = new Date();
  const cur = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  if(!project.records[dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate())]) cur.setDate(cur.getDate() - 1);
  while(true){
    const k = dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate());
    if(project.records[k]){ n++; cur.setDate(cur.getDate() - 1); }
    else break;
    if(n > 3650) break;
  }
  return n;
}
/* 某天的所有打卡（坚持） */
function projectsOnDate(dateKeyStr){
  return state.projects.filter(p => hasRecord(p, dateKeyStr));
}
/* 本月天数（有打卡的天数） + 本月总次数（所有项目笔数） */
function monthStats(year, month){
  const pre = `${year}-${pad2(month+1)}-`;
  const daySet = new Set();
  let count = 0;
  for(const p of state.projects){
    for(const k in p.records){
      if(k.startsWith(pre)){ daySet.add(k); count++; }
    }
  }
  return { days: daySet.size, count };
}
/* 所有坚持项目：总天数 + 总笔数 */
function allTimeStats(){
  const daySet = new Set();
  let count = 0;
  for(const p of state.projects){
    for(const k in p.records){ daySet.add(k); count++; }
  }
  return { days: daySet.size, count };
}

/* ---------- 正字渲染（共用） ---------- */
const STROKES = [
  [15,20, 85,20],
  [50,20, 50,80],
  [50,50, 75,50],
  [25,40, 25,80],
  [12,80, 88,80]
];
function seedFromKey(key, index){
  let h = 0;
  for(let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) | 0;
  return Math.abs(h) + index * 7919;
}
function rng(seed){
  let a = seed | 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function buildGlyph(count, seed, color){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  const rand = rng(seed);
  svg.style.transform = `rotate(${(rand()-0.5)*1.4}deg)`;
  for(let i = 0; i < count; i++){
    const [x1,y1,x2,y2] = STROKES[i];
    const jx1 = x1 + (rand()-0.5)*1.4;
    const jy1 = y1 + (rand()-0.5)*1.4;
    const jx2 = x2 + (rand()-0.5)*1.4;
    const jy2 = y2 + (rand()-0.5)*1.4;
    const mx = (jx1+jx2)/2, my = (jy1+jy2)/2;
    const dx = jx2-jx1, dy = jy2-jy1;
    const len = Math.hypot(dx,dy) || 1;
    const bow = (rand()-0.5)*1.8;
    const cx = mx - dy/len*bow, cy = my + dx/len*bow;
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M${jx1.toFixed(1)} ${jy1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${jx2.toFixed(1)} ${jy2.toFixed(1)}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color || 'var(--ink)');
    path.setAttribute('stroke-width', i === 0 || i === 4 ? 6.4 : (i === 1 ? 7.2 : 7.0));
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('opacity', '0.94');
    svg.appendChild(path);
  }
  return svg;
}
const MAX_GLYPHS = 12;
function renderGlyphs(el, n, keyPrefix, cap){
  el.innerHTML = '';
  const max = cap || MAX_GLYPHS;
  if(n === 0){
    const sp = document.createElement('span');
    sp.className = 'zmore';
    sp.textContent = '还没开始';
    sp.style.fontSize = '11.5px';
    el.appendChild(sp);
    return;
  }
  const full = Math.floor(n / 5);
  const part = n % 5;
  const showFull = Math.min(full, max);
  const frag = document.createDocumentFragment();
  for(let i = 0; i < showFull; i++) frag.appendChild(buildGlyph(5, seedFromKey(keyPrefix, i)));
  if(part && showFull < max) frag.appendChild(buildGlyph(part, seedFromKey(keyPrefix, showFull)));
  if(full > max){
    const sp = document.createElement('span');
    sp.className = 'zmore';
    sp.textContent = '…';
    frag.appendChild(sp);
  }
  el.appendChild(frag);
}

function lYearDays(y){ let sum = 348; for(let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0; return sum + leapDays(y); }
function leapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function leapDays(y){ return leapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
function monthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29; }
function solar2lunar(y, m, d){
  let offset = Math.round((Date.UTC(y, m-1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  let i, temp = 0;
  for(i = 1900; i < 2101 && offset > 0; i++){ temp = lYearDays(i); offset -= temp; }
  if(offset < 0){ offset += temp; i--; }
  const ly = i, leap = leapMonth(i);
  let isLeap = false;
  for(i = 1; i < 13 && offset > 0; i++){
    if(leap > 0 && i === leap + 1 && !isLeap){ --i; isLeap = true; temp = leapDays(ly); }
    else { temp = monthDays(ly, i); }
    if(isLeap && i === leap + 1) isLeap = false;
    offset -= temp;
  }
  if(offset === 0 && leap > 0 && i === leap + 1){ if(isLeap) isLeap = false; else { isLeap = true; --i; } }
  if(offset < 0){ offset += temp; --i; }
  return { y: ly, m: i, d: offset + 1, leap: isLeap };
}
function qingmingDay(y){ const yy = y % 100; return Math.floor(yy * 0.2422 + 4.81) - Math.floor((yy - 1) / 4); }
function getHoliday(y, m, d){
  if(m === 0 && d === 1) return '元旦';
  if(m === 4 && d === 1) return '劳动节';
  if(m === 9 && d === 1) return '国庆';
  if(m === 3 && d === qingmingDay(y)) return '清明';
  const l = solar2lunar(y, m+1, d);
  if(!l.leap){
    if(l.m === 1 && l.d === 1) return '春节';
    if(l.m === 1 && l.d === 15) return '元宵';
    if(l.m === 5 && l.d === 5) return '端午';
    if(l.m === 8 && l.d === 15) return '中秋';
  }
  if(l.m === 12 && l.d === monthDays(l.y, 12)) return '除夕';
  return null;
}
function lunarLabel(y, m, d){
  const l = solar2lunar(y, m+1, d);
  if(l.d === 1) return (l.leap ? '闰' : '') + L_MON[l.m] + '月';
  return L_DAY[l.d] || '';
}

/* ============================================================
   进度板块 · 数据
   ============================================================ */
function findProgress(id){ return state.progress.find(p => p.id === id); }
function addProgress({name, color, unit, target, pinned}){
  const p = {
    id: uid(),
    name: name || '未命名',
    color: color || COLORS[state.progress.length % COLORS.length],
    unit: unit || '',
    target: target || 0,
    current: 0,
    pinned: !!pinned,
    records: []   /* { t, value, tag } */
  };
  state.progress.push(p); saveState(); return p;
}
function updateProgress(id, patch){
  const p = findProgress(id); if(!p) return null;
  Object.assign(p, patch); saveState(); return p;
}
function removeProgress(id){
  const p = findProgress(id); if(!p) return;
  state.trash.push({ kind:'progress', data: clone(p), deletedAt: Date.now() });
  state.progress = state.progress.filter(x => x.id !== id);
  saveState();
}
function addProgressRecord(id, value, tag){
  const p = findProgress(id); if(!p) return;
  if(value === 0) return;
  p.records.push({ t: Date.now(), value, tag: tag || '' });
  p.current = p.current + value;
  saveState();
}
function removeProgressRecord(id, idx){
  const p = findProgress(id); if(!p) return;
  const rec = p.records[idx]; if(!rec) return;
  p.records.splice(idx, 1);
  p.current = p.current - rec.value;
  saveState();
}
function progressPct(p){
  if(p.target <= 0) return 0;
  const pct = p.current / p.target * 100;
  return Math.max(0, pct);
}
function isProgressDone(p){ return p.target > 0 && p.current >= p.target; }
function progressTags(p){
  const set = new Set();
  p.records.forEach(r => { if(r.tag) set.add(r.tag); });
  return [...set];
}
function progressMonthStats(p, year, month){
  const pre = `${year}-${pad2(month+1)}-`;
  let sum = 0, count = 0;
  const tagMap = {};
  p.records.forEach(r => {
    const d = new Date(r.t);
    const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    if(k.startsWith(pre)){
      sum += r.value;
      count++;
      if(r.tag) tagMap[r.tag] = (tagMap[r.tag] || 0) + r.value;
    }
  });
  return { sum, count, tagMap };
}

   顶部标题切换

let currentTab = 'project';
function setTab(tab){
  currentTab = tab;
  $$('.tab-item').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#pageProject').classList.toggle('hide', tab !== 'project');
  $('#pageProgress').classList.toggle('hide', tab !== 'progress');

  else renderProjectList();
}

/* ============================================================
   坚持板块 · 渲染
   ============================================================ */
const now = new Date();
const view = {
  year: now.getFullYear(),
  month: now.getMonth(),
  selDate: todayKey(),
  openProjectId: null,
  calMonth: {},
  bigCalYear: now.getFullYear(),
  bigCalMonth: now.getMonth()
};
const listEl = $('#list');

function renderDateBar(){
  const [y, m, d] = view.selDate.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const week = '日一二三四五六'[dt.getDay()];
  $('#dateText').innerHTML = `${y}年${m}月${d}日<span class="dim">· 周${week}</span>`;
  $('#btnToday').classList.toggle('hide', view.selDate === todayKey());
}
function changeDate(delta){
  const [y, m, d] = view.selDate.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + delta);
  view.selDate = dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
  renderMain();
}
function goToday(){ view.selDate = todayKey(); renderMain(); }

function renderMain(){
  renderDateBar();
  renderProjectList();
  if(currentTab === 'progress') renderProgressList();
}

function renderProjectList(){
  listEl.innerHTML = '';
  if(!state.projects.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<div class="big">正</div><p>还没有项目<br>建一个，开始写第一笔</p>';
    listEl.appendChild(e);
  }else{
    state.projects.forEach(p => listEl.appendChild(buildCard(p)));
  }
  const add = document.createElement('button');
  add.className = 'add-card';
  add.textContent = '＋ 新建坚持';
  add.onclick = () => openProjectModal(null);
  listEl.appendChild(add);
  applyOpenState();
}

function buildCard(p){
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.id = p.id;
  el.style.setProperty('--c', p.color);

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <span class="dot"></span>
    <div class="names">
      <h3 class="pname">${esc(p.name)}</h3>
      <svg class="tri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <span class="streak hide"></span>
    <button class="head-edit" data-edit>编辑</button>
    <button class="card-btn" data-btn></button>
  `;
  el.appendChild(head);

  const zrows = document.createElement('div');
  zrows.className = 'zrows';
  zrows.innerHTML = `
    <div class="zrow"><span class="zlabel">累计</span><span class="zglyphs" data-role="total"></span><span class="znum" data-role="total-num"></span></div>
    <div class="zrow"><span class="zlabel">本月</span><span class="zglyphs" data-role="month"></span><span class="znum" data-role="month-num"></span></div>
  `;
  el.appendChild(zrows);
  el._refs = { zrows, head };
  fillCardGlyphs(el, p);

  const expand = document.createElement('div');
  expand.className = 'expand';
  const inner = document.createElement('div');
  inner.className = 'expand-inner';
  expand.appendChild(inner);
  el.appendChild(expand);
  el._refs.expand = expand;
  el._refs.inner = inner;

  head.querySelector('[data-edit]').addEventListener('click', (e) => {
    e.stopPropagation();
    openProjectModal(p.id);
  });
  const btn = head.querySelector('[data-btn]');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const sel = view.selDate;
    if(hasRecord(p, sel)) return;
    setRecord(p, sel);
    if(!state.settings.hintRecorded){
      state.settings.hintRecorded = true;
      saveState();
      coach('已记 · 再点一下格子，可以写备注和标签');
    }
    renderMain();
  });
  head.querySelector('.names').addEventListener('click', () => { toggleCard(p.id); });
  zrows.addEventListener('click', () => { toggleCard(p.id); });

  refreshCardButton(el, p);
  refreshStreak(el, p);
  return el;
}

function refreshStreak(el, p){
  const s = el._refs.head.querySelector('.streak');
  const n = streakOf(p);
  if(n > 0){ s.textContent = `连续 ${n} 天`; s.classList.remove('hide'); }
  else s.classList.add('hide');
}

function refreshCardButton(cardEl, p){
  const btn = cardEl.querySelector('[data-btn]');
  if(!btn) return;
  const sel = view.selDate;
  const tk = todayKey();
  const done = hasRecord(p, sel);
  cardEl.classList.toggle('done', done && sel === tk);
  const isLight = luminance(p.color) > 0.62;
  btn.classList.remove('record','done','dark-text');
  if(done){
    btn.classList.add('done');
    btn.textContent = '已记';
  }else{
    btn.classList.add('record');
    if(isLight) btn.classList.add('dark-text');
    btn.textContent = sel === tk ? '记一笔' : '补一笔';
  }
}

function fillCardGlyphs(cardEl, p){
  const R = cardEl._refs;
  const total = countTotal(p);
  const mCount = countMonth(p, view.year, view.month);
  renderGlyphs(R.zrows.querySelector('[data-role="total"]'), total, 'p'+p.id);
  renderGlyphs(R.zrows.querySelector('[data-role="month"]'), mCount, 'p'+p.id+'m'+view.year+view.month);
  R.zrows.querySelector('[data-role="total-num"]').textContent = total;
  R.zrows.querySelector('[data-role="month-num"]').textContent = mCount;
}

function toggleCard(id){ if(view.openProjectId === id) closeCard(); else openCard(id); }

function openCard(id){
  const p = findProject(id);
  if(!p) return;
  view.openProjectId = id;
  if(!view.calMonth[id]) view.calMonth[id] = { y: view.year, m: view.month };
  const card = listEl.querySelector(`.card[data-id="${id}"]`);
  if(!card) return;
  renderCardExpand(card, p);
  requestAnimationFrame(() => {
    card.classList.add('open');
    card._refs.expand.style.height = card._refs.inner.scrollHeight + 'px';
  });
  setTimeout(() => {
    const r = card.getBoundingClientRect();
    if(r.top < 90 || r.bottom > window.innerHeight - 80){
      window.scrollTo({ top: window.scrollY + r.top - 100, behavior: 'smooth' });
    }
  }, 80);
}

function closeCard(){
  const id = view.openProjectId;
  view.openProjectId = null;
  const card = listEl.querySelector(`.card[data-id="${id}"]`);
  if(card){ card.classList.remove('open'); card._refs.expand.style.height = '0px'; }
}

function applyOpenState(){
  $$('.card', listEl).forEach(el => {
    const isOpen = el.dataset.id === view.openProjectId;
    el.classList.toggle('open', isOpen);
    if(!isOpen) el._refs.expand.style.height = '0px';
  });
}

/* 展开后的内容：全量正字 + 本月标签 + 月历 */
function renderCardExpand(card, p){
  const inner = card._refs.inner;
  inner.innerHTML = '';

  /* 全量正字 */
  const tianWrap = document.createElement('div');
  tianWrap.className = 'full-tian';
  tianWrap.innerHTML = '<div class="full-tian-label">全部正字</div>';
  const glyphBox = document.createElement('div');
  glyphBox.className = 'full-tian-glyphs';
  const total = countTotal(p);
  if(total === 0){
    glyphBox.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:4px 0">还没开始</div>';
  }else{
    const full = Math.floor(total / 5);
    const part = total % 5;
    const maxShow = 36;
    const frag = document.createDocumentFragment();
    for(let i = 0; i < Math.min(full, maxShow); i++){
      frag.appendChild(buildGlyph(5, seedFromKey('p'+p.id, i)));
    }
    if(part && full < maxShow){
      frag.appendChild(buildGlyph(part, seedFromKey('p'+p.id, full)));
    }
    if(full > maxShow){
      const sp = document.createElement('span');
      sp.className = 'zmore';
      sp.textContent = '…';
      frag.appendChild(sp);
    }
    glyphBox.appendChild(frag);
  }
  tianWrap.appendChild(glyphBox);
  inner.appendChild(tianWrap);

  /* 本月标签统计 */
  const cm = view.calMonth[p.id] || { y: view.year, m: view.month };
  const tagStats = tagStatsOfMonth(p, cm.y, cm.m);
  if(Object.keys(tagStats).length > 0){
    const tagWrap = document.createElement('div');
    tagWrap.className = 'tag-stat';
    tagWrap.innerHTML = '<div class="tag-stat-label">本月标签</div>';
    Object.entries(tagStats).sort((a,b)=>b[1]-a[1]).forEach(([tag, n]) => {
      const row = document.createElement('div');
      row.className = 'tag-row';
      row.innerHTML = `<span>${esc(tag)}</span><span class="tag-val">${n} 天</span>`;
      tagWrap.appendChild(row);
    });
    inner.appendChild(tagWrap);
  }

  /* 月历 */
  inner.appendChild(buildCalendar(p));

  requestAnimationFrame(() => { card._refs.expand.style.height = inner.scrollHeight + 'px'; });
}

function tagStatsOfMonth(p, y, m){
  const pre = `${y}-${pad2(m+1)}-`;
  const map = {};
  for(const k in p.records){
    if(k.startsWith(pre)){
      const t = p.records[k].tag;
      if(t) map[t] = (map[t] || 0) + 1;
    }
  }
  return map;
}

/* ============================================================
   坚持 · 月历
   ============================================================ */
function buildCalendar(p){
  const wrap = document.createElement('div');
  wrap.className = 'cal-wrap';

  if(!view.calMonth[p.id]) view.calMonth[p.id] = { y: view.year, m: view.month };
  const cm = view.calMonth[p.id];

  const head = document.createElement('div');
  head.className = 'cal-head';
  head.innerHTML = `
    <button class="cal-nav" data-dir="-1">‹</button>
    <span class="cal-month">${cm.y}年${cm.m+1}月</span>
    <button class="cal-nav" data-dir="1">›</button>
    <span class="cal-stat"></span>
  `;
  wrap.appendChild(head);

  head.querySelectorAll('.cal-nav').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const dir = parseInt(btn.dataset.dir);
      let ny = cm.y, nm = cm.m + dir;
      if(nm < 0){ nm = 11; ny--; }
      if(nm > 11){ nm = 0; ny++; }
      cm.y = ny; cm.m = nm;
      const card = listEl.querySelector(`.card[data-id="${p.id}"]`);
      if(card) renderCardExpand(card, p);
    });
  });

  const wd = document.createElement('div');
  wd.className = 'weekdays';
  wd.innerHTML = WEEK.map(w => `<span>${w}</span>`).join('');
  wrap.appendChild(wd);

  wrap.appendChild(buildMonthGrid(p, cm.y, cm.m));

  const foot = document.createElement('div');
  foot.className = 'cal-foot';
  wrap.appendChild(foot);

  updateCalStat(wrap, p, cm.y, cm.m);
  return wrap;
}

function updateCalStat(wrap, p, y, m){
  const mc = countMonth(p, y, m);
  const dim = new Date(y, m+1, 0).getDate();
  const rate = Math.round(mc / dim * 100);
  const stat = wrap.querySelector('.cal-stat');
  if(stat) stat.textContent = `${mc} 次`;
  const foot = wrap.querySelector('.cal-foot');
  if(foot) foot.innerHTML = `<span>本月打卡 <b>${mc}</b> 次</span><span>完成率 <b>${rate}%</b></span>`;
}

function buildMonthGrid(p, y, m){
  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const dim = new Date(y, m+1, 0).getDate();
  const tk = todayKey();
  const isLight = luminance(p.color) > 0.62;

  for(let i = 0; i < 42; i++){
    const d = i - startDow + 1;
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(d < 1 || d > dim){ cell.classList.add('blank'); grid.appendChild(cell); continue; }

    const key = dateKey(y, m, d);
    const rec = getRecord(p, key);
    const isFuture = key > tk;
    cell.dataset.k = key;
    if(key === tk) cell.classList.add('today');
    if(isFuture) cell.classList.add('future');

    if(rec){
      cell.classList.add('on');
      if(isFuture){ cell.style.background = rgba(p.color, 0.28); cell.classList.add('dark'); }
      else { cell.style.background = p.color; if(isLight) cell.classList.add('dark'); }
      if(rec.note && rec.note.trim()){
        const nd = document.createElement('span');
        nd.className = 'nd';
        cell.appendChild(nd);
      }
    }

    const dEl = document.createElement('span');
    dEl.className = 'd';
    dEl.textContent = d;
    cell.appendChild(dEl);

    let sub = null, isHol = false;
    if(state.settings.holiday){ const h = getHoliday(y, m, d); if(h){ sub = h; isHol = true; } }
    if(!sub && state.settings.lunar) sub = lunarLabel(y, m, d);
    if(sub){
      const lEl = document.createElement('span');
      lEl.className = 'l' + (isHol ? ' hol' : '');
      lEl.textContent = sub.length > 3 ? sub.slice(0,3) : sub;
      lEl.style.transform = `scale(${sub.length > 2 ? 0.82 : 0.92})`;
      cell.appendChild(lEl);
    }

    cell.addEventListener('click', (e) => { e.stopPropagation(); onCellClick(p, key, cell); });
    grid.appendChild(cell);
  }
  return grid;
}

function onCellClick(p, key, cellEl){
  if(hasRecord(p, key)){
    openRecordModal(p.id, key);
    return;
  }
  setRecord(p, key);
  applyCellStyle(cellEl, p, key);
  if(!state.settings.hintRecorded){
    state.settings.hintRecorded = true;
    saveState();
    coach('已记 · 再点一下格子，可以写备注和标签');
  }
  const card = listEl.querySelector(`.card[data-id="${p.id}"]`);
  if(card) fillCardGlyphs(card, p);
  const wrap = cellEl.closest('.cal-wrap');
  if(wrap){
    const cm = view.calMonth[p.id] || { y: view.year, m: view.month };
    updateCalStat(wrap, p, cm.y, cm.m);
  }
  if(card){
    refreshCardButton(card, p);
    refreshStreak(card, p);
    if(view.openProjectId === p.id){
      requestAnimationFrame(() => { card._refs.expand.style.height = card._refs.inner.scrollHeight + 'px'; });
    }
  }
}

function applyCellStyle(cell, p, key){
  const rec = getRecord(p, key);
  const tk = todayKey();
  const isFuture = key > tk;
  const isLight = luminance(p.color) > 0.62;
  cell.classList.remove('on','dark');
  cell.style.background = '';
  if(rec){
    cell.classList.add('on');
    if(isFuture){ cell.style.background = rgba(p.color, 0.28); cell.classList.add('dark'); }
    else { cell.style.background = p.color; if(isLight) cell.classList.add('dark'); }
  }
  let nd = cell.querySelector('.nd');
  const hasNote = rec && rec.note && rec.note.trim();
  if(hasNote && !nd){ nd = document.createElement('span'); nd.className = 'nd'; cell.appendChild(nd); }
  else if(!hasNote && nd){ nd.remove(); }
}

/* ============================================================
   进度板块 · 渲染
   ============================================================ */
const progressListEl = $('#progressList');

function renderProgressList(){
  progressListEl.innerHTML = '';
  if(!state.progress.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<div class="big">进</div><p>还没有进度<br>建一个，开始累积</p>';
    progressListEl.appendChild(e);
  }else{
    const sorted = [...state.progress].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
    sorted.forEach(p => progressListEl.appendChild(buildProgressCard(p)));
  }
  const add = document.createElement('button');
  add.className = 'add-card';
  add.textContent = '＋ 新建进度';
  add.onclick = () => openProgressModal(null);
  progressListEl.appendChild(add);
}

function buildProgressCard(p){
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.pid = p.id;
  el.style.setProperty('--c', p.color);

  const pct = progressPct(p);
  const done = isProgressDone(p);

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <span class="dot"></span>
    <div class="names">
      <h3 class="pname">${esc(p.name)}</h3>
      <svg class="tri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <button class="head-edit" data-edit>编辑</button>
    <button class="card-btn record" data-btn>记</button>
  `;
  el.appendChild(head);

  const body = document.createElement('div');
  body.style.marginTop = '12px';
  body.style.cursor = 'pointer';
  body.innerHTML = `
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <div>
        <span class="progress-num">${fmtNum(p.current)}</span>
        <span class="progress-unit">/ ${fmtNum(p.target)}${p.unit ? ' ' + esc(p.unit) : ''}</span>
      </div>
      <span style="font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums">${Math.round(pct)}%</span>
    </div>
    <div class="progress-bar${done?' done':''}"><i style="width:${Math.min(pct,100)}%"></i></div>
    ${done ? `<div style="font-size:12px;color:#C9A961;margin-top:8px;letter-spacing:.3px">✦ 已达成</div>` : ''}
  `;
  el.appendChild(body);
  el._body = body;

  const expand = document.createElement('div');
  expand.className = 'expand';
  const inner = document.createElement('div');
  inner.className = 'expand-inner';
  expand.appendChild(inner);
  el.appendChild(expand);
  el._refs = { expand, inner, head, body };

  head.querySelector('[data-edit]').addEventListener('click', (e) => {
    e.stopPropagation();
    openProgressModal(p.id);
  });
  head.querySelector('[data-btn]').addEventListener('click', (e) => {
    e.stopPropagation();
    openProgressRecordModal(p.id);
  });
  head.querySelector('.names').addEventListener('click', () => { toggleProgressCard(p.id); });
  body.addEventListener('click', () => { toggleProgressCard(p.id); });

  return el;
}

let openProgressId = null;
function toggleProgressCard(id){
  if(openProgressId === id) closeProgressCard();
  else openProgressCard(id);
}
function openProgressCard(id){
  const p = findProgress(id); if(!p) return;
  openProgressId = id;
  const el = progressListEl.querySelector(`.card[data-pid="${id}"]`);
  if(!el) return;
  renderProgressExpand(el, p);
  requestAnimationFrame(() => {
    el.classList.add('open');
    el._refs.expand.style.height = el._refs.inner.scrollHeight + 'px';
  });
}
function closeProgressCard(){
  const id = openProgressId;
  openProgressId = null;
  const el = progressListEl.querySelector(`.card[data-pid="${id}"]`);
  if(el){ el.classList.remove('open'); el._refs.expand.style.height = '0px'; }
}

function renderProgressExpand(el, p){
  const inner = el._refs.inner;
  inner.innerHTML = '';

  /* 本月汇总 */
  const cm = { y: view.year, m: view.month };
  const ms = progressMonthStats(p, cm.y, cm.m);
  if(ms.count > 0){
    const wrap = document.createElement('div');
    wrap.className = 'tag-stat';
    wrap.innerHTML = '<div class="tag-stat-label">本月</div>';
    const tagKeys = Object.keys(ms.tagMap);
    if(tagKeys.length > 0){
      tagKeys.sort((a,b) => Math.abs(ms.tagMap[b]) - Math.abs(ms.tagMap[a])).forEach(tag => {
        const row = document.createElement('div');
        row.className = 'tag-row';
        const v = ms.tagMap[tag];
        row.innerHTML = `<span>${esc(tag)}</span><span class="tag-val">${v > 0 ? '+' : ''}${fmtNum(v)} ${esc(p.unit)}</span>`;
        wrap.appendChild(row);
      });
      const total = document.createElement('div');
      total.className = 'tag-row';
      total.style.borderTop = '.5px solid var(--sep)';
      total.style.marginTop = '4px';
      total.style.paddingTop = '8px';
      total.style.fontWeight = '500';
      total.innerHTML = `<span>合计</span><span class="tag-val" style="color:var(--text)">${ms.sum > 0 ? '+' : ''}${fmtNum(ms.sum)} ${esc(p.unit)} · ${ms.count} 次</span>`;
      wrap.appendChild(total);
    }else{
      const row = document.createElement('div');
      row.className = 'tag-row';
      row.innerHTML = `<span>共 ${ms.count} 次</span><span class="tag-val">${ms.sum > 0 ? '+' : ''}${fmtNum(ms.sum)} ${esc(p.unit)}</span>`;
      wrap.appendChild(row);
    }
    inner.appendChild(wrap);
  }

  /* 最近记录 */
  const recent = [...p.records].slice(-3).reverse();
  if(recent.length > 0){
    const wrap = document.createElement('div');
    wrap.className = 'tag-stat';
    wrap.innerHTML = '<div class="tag-stat-label">最近记录</div>';
    recent.forEach(r => {
      const d = new Date(r.t);
      const row = document.createElement('div');
      row.className = 'rec-row';
      row.innerHTML = `
        <div class="rec-left">
          <span class="rec-date">${d.getMonth()+1}月${d.getDate()}日</span>
          ${r.tag ? `<span class="rec-tag">${esc(r.tag)}</span>` : ''}
        </div>
        <span class="rec-num ${r.value >= 0 ? 'plus' : 'minus'}">${r.value > 0 ? '+' : ''}${fmtNum(r.value)}</span>
      `;
      wrap.appendChild(row);
    });
    inner.appendChild(wrap);
  }

  /* 查看全部 */
  const allBtn = document.createElement('button');
  allBtn.className = 'btn ghost';
  allBtn.style.marginTop = '14px';
  allBtn.style.width = '100%';
  allBtn.textContent = '查看全部记录';
  allBtn.onclick = (e) => { e.stopPropagation(); openProgressHistory(p.id); };
  inner.appendChild(allBtn);

  /* 记一笔 */
  const recBtn = document.createElement('button');
  recBtn.className = 'btn primary';
  recBtn.style.marginTop = '10px';
  recBtn.style.width = '100%';
  recBtn.textContent = '记一笔';
  recBtn.onclick = (e) => { e.stopPropagation(); openProgressRecordModal(p.id); };
  inner.appendChild(recBtn);

  /* 达成后：继续记 / 归档 */
  if(isProgressDone(p)){
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.gap = '10px';
    row.style.marginTop = '10px';
    const keepBtn = document.createElement('button');
    keepBtn.className = 'btn ghost';
    keepBtn.textContent = '继续记';
    keepBtn.onclick = (e) => { e.stopPropagation(); openProgressRecordModal(p.id); };
    const archBtn = document.createElement('button');
    archBtn.className = 'btn ghost';
    archBtn.textContent = '归档';
    archBtn.onclick = (e) => {
      e.stopPropagation();
      if(!confirm('归档后，这个进度会移到垃圾桶，数据保留可恢复。确定吗？')) return;
      removeProgress(p.id);
      openProgressId = null;
      renderProgressList();
    };
    row.appendChild(keepBtn);
    row.appendChild(archBtn);
    inner.appendChild(row);
  }

  requestAnimationFrame(() => { el._refs.expand.style.height = inner.scrollHeight + 'px'; });
}

  page.innerHTML = `
    <div class="page-nav">

    </div>
    <div class="field" id="histBody"></div>
  `;
  pageHost.appendChild(page);

  if(!p.records.length){
    body.innerHTML = '<div class="empty"><div class="big">空</div><p>还没有记录</p></div>';
  }else{
    /* 按月份分组 */
    const groups = {};
    [...p.records].reverse().forEach((r, i) => {
      const d = new Date(r.t);
      const key = `${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
      if(!groups[key]) groups[key] = [];
      groups[key].push({ ...r, _idx: p.records.length - 1 - i });
    });
    Object.entries(groups).forEach(([key, arr]) => {
      const h = document.createElement('div');
      h.className = 'rec-month';
      h.textContent = key;
      body.appendChild(h);
      arr.forEach(r => {
        const d = new Date(r.t);
        const row = document.createElement('div');
        row.className = 'rec-row';
        row.innerHTML = `
          <div class="rec-left">
            <span class="rec-date">${d.getMonth()+1}月${d.getDate()}日</span>
            ${r.tag ? `<span class="rec-tag">${esc(r.tag)}</span>` : ''}
          </div>
          <span class="rec-num ${r.value >= 0 ? 'plus' : 'minus'}">${r.value > 0 ? '+' : ''}${fmtNum(r.value)}</span>
        `;
        row.style.cursor = 'pointer';
        row.addEventListener('click', () => {
          if(!confirm(`删除这条记录？\n${r.tag ? '[' + r.tag + '] ' : ''}${r.value > 0 ? '+' : ''}${fmtNum(r.value)}`)) return;
          removeProgressRecord(p.id, r._idx);
          page.remove();
          renderProgressList();
        });
        body.appendChild(row);
      });
    });
  }

  page.querySelector('#backBtn').addEventListener('click', () => {
    page.classList.remove('show');
    setTimeout(() => { if(page.parentNode === pageHost) page.remove(); }, 420);
  });
  requestAnimationFrame(() => page.classList.add('show'));

const maskHost = $('#maskHost');
const modalHost = $('#modalHost');
const pageHost = $('#pageHost');

function showMask(onClose){
  maskHost.innerHTML = '';
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.addEventListener('click', () => { if(onClose) onClose(); });
  maskHost.appendChild(mask);
  requestAnimationFrame(() => mask.classList.add('show'));
}
function hideMask(){
  const mask = maskHost.querySelector('.mask');
  if(mask){
    mask.classList.remove('show');
    setTimeout(() => { if(mask.parentNode === maskHost) maskHost.innerHTML = ''; }, 320);
  }
}
function openModal(renderFn){
  modalHost.innerHTML = '';
  showMask(() => closeModal());
  const modal = document.createElement('div');
  modal.className = 'modal';
  modalHost.appendChild(modal);
  renderFn(modal);
  requestAnimationFrame(() => modal.classList.add('show'));
  return modal;
}
function closeModal(){
  const modal = modalHost.querySelector('.modal');
  if(modal){
    modal.classList.remove('show');
    setTimeout(() => { if(modal.parentNode === modalHost) modalHost.innerHTML = ''; }, 320);
  }
  hideMask();
}

/* ============================================================
   坚持 · 记录编辑弹窗（打卡 / 备注 / 标签 / 取消）
   ============================================================ */
function openRecordModal(projectId, dateKeyStr){
  const p = findProject(projectId);
  if(!p) return;
  let rec = getRecord(p, dateKeyStr);
  const isChecked = !!rec;

  const [yy, mm, dd] = dateKeyStr.split('-').map(Number);
  const d = new Date(yy, mm-1, dd);
  const week = '日一二三四五六'[d.getDay()];
  const isFuture = dateKeyStr > todayKey();

  openModal(modal => {
    let sub = '';
    if(rec){
      const time = new Date(rec.t);
      sub = `已打卡 · ${pad2(time.getHours())}:${pad2(time.getMinutes())}${isFuture ? ' · 预打卡' : ''}`;
    }else{
      sub = isFuture ? '还没到 · 预打卡' : '尚未打卡';
    }

    modal.innerHTML = `
      <h3 class="modal-title">${mm}月${dd}日 周${week}</h3>
      <div class="modal-sub">${sub}</div>
      <div class="form-label">备注</div>
      <textarea class="form-input" id="noteInput" placeholder="写点什么…"></textarea>
      <div class="form-label" style="margin-top:14px">标签（可选）</div>
      <input class="form-input" id="tagInput" placeholder="如：人类简史、跑步">
      <div class="chips" id="chipRow"></div>
      <div class="modal-actions">
        <button class="btn danger" id="btnRemove" style="${isChecked ? '' : 'display:none'}">取消打卡</button>
        <button class="btn primary" id="btnCheck">${isChecked ? '完成' : '打卡'}</button>
      </div>
    `;

    const ta = modal.querySelector('#noteInput');
    const tagIn = modal.querySelector('#tagInput');
    ta.value = rec ? (rec.note || '') : '';
    tagIn.value = rec ? (rec.tag || '') : '';

    let saveTimer = null;
    const save = () => {
      if(!rec) return;
      setNote(p, dateKeyStr, ta.value);
      setTag(p, dateKeyStr, tagIn.value.trim());
    };
    const debounceSave = () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 350);
    };
    ta.addEventListener('input', debounceSave);
    tagIn.addEventListener('input', debounceSave);

    /* 常用标签（从历史提取） */
    const chipRow = modal.querySelector('#chipRow');
    const allTags = new Set();
    Object.values(p.records).forEach(r => { if(r.tag) allTags.add(r.tag); });
    [...allTags].slice(0, 8).forEach(t => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = t;
      chip.addEventListener('click', (e) => {
        e.preventDefault();
        tagIn.value = t;
        debounceSave();
      });
      chipRow.appendChild(chip);
    });

    modal.querySelector('#btnCheck').addEventListener('click', () => {
      if(!rec){
        setRecord(p, dateKeyStr);
        rec = getRecord(p, dateKeyStr);
      }
      save();
      closeModal();
      renderMain();
      /* 检测里程碑 */
      checkMilestones(p);
    });

    modal.querySelector('#btnRemove').addEventListener('click', () => {
      if(rec && ((rec.note && rec.note.trim()) || (rec.tag && rec.tag.trim()))){
        if(!confirm('这条记录有内容，取消打卡会一起删掉。确定吗？')) return;
      }
      removeRecord(p, dateKeyStr);
      closeModal();
      renderMain();
    });
  });
}

/* 里程碑检查（在记录之后调用） */
function checkMilestones(p){
  const total = countTotal(p);
  const st = streakOf(p);
  const milestones = [
    { cond: total === 1, msg: `「${p.name}」的第一笔，写下了` },
    { cond: total === 5, msg: `「${p.name}」写完第一个正字了` },
    { cond: total === 10, msg: `「${p.name}」写了 2 个正字` },
    { cond: total === 25, msg: `「${p.name}」写了 5 个正字` },
    { cond: total === 50, msg: `「${p.name}」写了 10 个正字` },
    { cond: st === 7, msg: `「${p.name}」连续 7 天` },
    { cond: st === 30, msg: `「${p.name}」连续 30 天` },
    { cond: st === 100, msg: `「${p.name}」连续 100 天` },
    { cond: st === 365, msg: `「${p.name}」连续一整年` }
  ];
  for(const m of milestones){
    if(m.cond){ setTimeout(() => coach(m.msg), 400); return; }
  }
}

          if(card && fresh) renderCardExpand(card, fresh);

        if(!confirm(`把「${p.name}」移到垃圾桶？\n数据会保留，可随时恢复。`)) return;
        removeProject(p.id);
        if(view.openProjectId === p.id) view.openProjectId = null;
        closeModal();
        setTimeout(renderMain, 200);
      });
      const btnUp = modal.querySelector('#btnUp');
      const btnDown = modal.querySelector('#btnDown');
      if(btnUp) btnUp.addEventListener('click', () => {
        const i = state.projects.findIndex(x => x.id === p.id);
        if(i > 0){
          [state.projects[i-1], state.projects[i]] = [state.projects[i], state.projects[i-1]];
          saveState(); closeModal(); setTimeout(renderMain, 200);
        }
      });
      if(btnDown) btnDown.addEventListener('click', () => {
        const i = state.projects.findIndex(x => x.id === p.id);
        if(i < state.projects.length - 1){
          [state.projects[i+1], state.projects[i]] = [state.projects[i], state.projects[i+1]];
          saveState(); closeModal(); setTimeout(renderMain, 200);
        }
      });
    }
    if(isNew){ setTimeout(() => modal.querySelector('#pName').focus(), 320); }
  });
}

/* ============================================================

function openProgressRecordModal(id){
  const p = findProgress(id);
  if(!p) return;

  openModal(modal => {
    modal.innerHTML = `
      <h3 class="modal-title">${esc(p.name)}</h3>
      <div class="modal-sub">当前 ${fmtNum(p.current)}${p.unit ? ' ' + esc(p.unit) : ''}</div>

      <div class="form-label">数量</div>
      <div class="num-row">
        <button class="sign-btn" id="signBtn">+</button>
        <input class="form-input" id="valInput" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
        <span style="display:flex;align-items:center;padding:0 8px;color:var(--text2);font-size:14px">${esc(p.unit)}</span>
      </div>

      <div class="form-row" style="margin-top:14px">

        <input class="form-input" id="tagInput" placeholder="如：工资、收租">
      </div>
      <div class="chips" id="tagChips"></div>

      <div class="modal-actions">
        <button class="btn ghost" id="btnCancel">取消</button>
        <button class="btn primary" id="btnOk">记一笔</button>
      </div>
    `;

    const valIn = modal.querySelector('#valInput');
    const tagIn = modal.querySelector('#tagInput');
    const signBtn = modal.querySelector('#signBtn');

    let sign = 1;
    signBtn.addEventListener('click', () => {
      sign = -sign;
      signBtn.textContent = sign === 1 ? '+' : '−';
      signBtn.classList.toggle('minus', sign === -1);
      valIn.focus();
    });

    /* 历史标签 */
    const tags = progressTags(p);
    const chipRow = modal.querySelector('#tagChips');
    tags.slice(0, 8).forEach(t => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = t;
      chip.addEventListener('click', (e) => {
        e.preventDefault();
        tagIn.value = t;
      });
      chipRow.appendChild(chip);
    });

    modal.querySelector('#btnCancel').addEventListener('click', closeModal);
    modal.querySelector('#btnOk').addEventListener('click', () => {
      const raw = parseFloat(valIn.value);
      if(!raw || isNaN(raw)){ toast('请输入数量'); return; }
      const val = raw * sign;
      addProgressRecord(p.id, val, tagIn.value.trim());
      closeModal();
      setTimeout(() => {
        renderProgressList();
        const el = progressListEl.querySelector(`.card[data-pid="${p.id}"]`);
        const fresh = findProgress(p.id);
        if(el && fresh){
          /* 自动展开看效果 */
          openProgressId = fresh.id;
          renderProgressExpand(el, fresh);
          requestAnimationFrame(() => {
            el.classList.add('open');
            el._refs.expand.style.height = el._refs.inner.scrollHeight + 'px';
          });
        }
        if(isProgressDone(fresh)) coach(`「${fresh.name}」达成目标`);
      }, 200);
    });

    setTimeout(() => valIn.focus(), 320);
  });
}

    setTimeout(() => { if(page.parentNode === pageHost) page.remove(); }, 420);

  requestAnimationFrame(() => page.classList.add('show'));
}

function renderBigCalendar(wrap){
  wrap.innerHTML = '';
  const y = view.bigCalYear, m = view.bigCalMonth;
  const mode = state.settings.calMode || 'stripe';

  const head = document.createElement('div');
  head.className = 'cal-head';
  head.innerHTML = `
    <button class="cal-nav" data-dir="-1">‹</button>
    <span class="cal-month">${y}年${m+1}月</span>
    <button class="cal-nav" data-dir="1">›</button>
  `;
  wrap.appendChild(head);
  head.querySelectorAll('.cal-nav').forEach(btn => {
    btn.addEventListener('click', () => {
      const dir = parseInt(btn.dataset.dir);
      let ny = view.bigCalYear, nm = view.bigCalMonth + dir;
      if(nm < 0){ nm = 11; ny--; }
      if(nm > 11){ nm = 0; ny++; }
      view.bigCalYear = ny;
      view.bigCalMonth = nm;
      renderBigCalendar(wrap);
    });
  });

  const wd = document.createElement('div');
  wd.className = 'weekdays';
  wd.innerHTML = WEEK.map(w => `<span>${w}</span>`).join('');
  wrap.appendChild(wd);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const dim = new Date(y, m+1, 0).getDate();
  const tk = todayKey();

  for(let i = 0; i < 42; i++){
    const d = i - startDow + 1;
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(d < 1 || d > dim){ cell.classList.add('blank'); grid.appendChild(cell); continue; }
    const key = dateKey(y, m, d);
    if(key === tk) cell.classList.add('today');

    const dEl = document.createElement('span');
    dEl.className = 'd';
    dEl.textContent = d;
    cell.appendChild(dEl);

    const onProjects = projectsOnDate(key);

    if(mode === 'tian'){
      if(onProjects.length > 0){
        const cnt = Math.min(onProjects.length, 5);
        const mini = document.createElement('div');
        mini.className = 'tian-mini';
        mini.appendChild(buildGlyph(cnt, seedFromKey('day' + key, 0)));
        cell.appendChild(mini);
      }
    }else{
      if(onProjects.length > 0){
        const stripes = document.createElement('div');
        stripes.className = 'stripes';
        const maxShow = 3;
        onProjects.slice(0, maxShow).forEach(p => {
          const s = document.createElement('div');
          s.className = 'stripe';
          s.style.background = p.color;
          const txt = document.createElement('div');
          txt.className = 'stripe-txt';
          txt.textContent = p.name.length > 3 ? p.name.slice(0,3) : p.name;
          s.appendChild(txt);
          stripes.appendChild(s);
        });
        if(onProjects.length > maxShow){
          const more = document.createElement('div');
          more.className = 'more-num';
          more.textContent = '+' + (onProjects.length - maxShow);
          stripes.appendChild(more);
        }
        cell.appendChild(stripes);
      }
    }

    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
}

function shareMonth(y, m, range){
  range = range || 'month';
  const W = 760, H = 1100;
  const dpr = 2;
  const cv = document.createElement('canvas');
  cv.width = W * dpr;
  cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (document.documentElement.getAttribute('data-theme') === 'auto' && window.matchMedia('(prefers-color-scheme:dark)').matches);

  /* 纸墨风底色（浅色模式）*/
  const bg = isDark ? '#1A1815' : '#FAF8F3';
  const fg = isDark ? '#E8E2D6' : '#2A2622';
  const fg2 = isDark ? '#8B857A' : '#8A857C';
  const fg3 = isDark ? '#4A4640' : '#C4BFB5';
  const seal = '#B14B3A';

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* 计算范围 */
  const now = new Date();
  let fromY = y, fromM = m, toY = y, toM = m;
  let label = `${y}年${m+1}月`;
  if(range === '3m'){
    const d = new Date(y, m - 2, 1);
    fromY = d.getFullYear(); fromM = d.getMonth();
    toY = y; toM = m;
    label = `${fromY}.${fromM+1} — ${toY}.${toM+1}`;
  }else if(range === 'year'){
    fromY = y; fromM = 0;
    toY = y; toM = 11;
    label = `${y}年`;
  }else if(range === 'all'){
    /* 找最早记录 */
    let earliest = null;
    for(const p of state.projects){
      for(const k in p.records){
        if(!earliest || k < earliest) earliest = k;
      }
    }
    if(earliest){
      const [ey, em] = earliest.split('-').map(Number);
      fromY = ey; fromM = em - 1;
    }
    label = '全部记录';
  }

  const inRange = (key) => {
    const [yy, mm] = key.split('-').map(Number);
    const ym = yy * 12 + mm;
    return ym >= fromY * 12 + (fromM+1) && ym <= toY * 12 + (toM+1);
  };

  /* 标题 */
  ctx.fillStyle = fg;
  ctx.font = '600 38px -apple-system,"PingFang SC",sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText(label, W/2 - ctx.measureText(label).width/2, 70);

  /* 统计 */
  const daySet = new Set();
  let totalCount = 0;
  for(const p of state.projects){
    for(const k in p.records){
      if(inRange(k)){ daySet.add(k); totalCount++; }
    }
  }
  const days = daySet.size;

  ctx.font = '500 24px -apple-system,"PingFang SC",sans-serif';
  ctx.fillStyle = fg;
  const l1 = `坚持 ${days} 天`;
  ctx.fillText(l1, W/2 - ctx.measureText(l1).width/2, 140);
  const l2 = `写下 ${totalCount} 笔`;
  ctx.fillText(l2, W/2 - ctx.measureText(l2).width/2, 178);

  /* 正字 */
  const zy = 240;
  const full = Math.floor(totalCount / 5);
  const part = totalCount % 5;
  const size = 32, gap = 2;
  const maxZ = Math.min(full, 12);
  const numGlyphs = maxZ + (part && maxZ < 12 ? 1 : 0);
  const totalWidth = numGlyphs * (size + gap) - gap;
  let zx = W/2 - totalWidth / 2;

  const drawGlyph = (cnt, color) => {
    ctx.save();
    ctx.translate(zx, zy);
    ctx.strokeStyle = color;
    ctx.lineWidth = size / 100 * 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for(let s = 0; s < cnt; s++){
      const [x1,y1,x2,y2] = STROKES[s];
      ctx.beginPath();
      ctx.moveTo(x1/100*size, y1/100*size);
      ctx.quadraticCurveTo((x1+x2)/2/100*size, (y1+y2)/2/100*size, x2/100*size, y2/100*size);
      ctx.stroke();
    }
    ctx.restore();
  };
  for(let i = 0; i < maxZ; i++){ drawGlyph(5, fg); zx += size + gap; }
  if(part && maxZ < 12){ drawGlyph(part, fg); zx += size + gap; }
  if(full > 12){
    ctx.fillStyle = fg2;
    ctx.font = '400 24px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText('…', zx, zy + 4);
  }

  /* 各项目 */
  let py = zy + size + 40;
  ctx.font = '400 18px -apple-system,"PingFang SC",sans-serif';
  state.projects.forEach(p => {
    let c = 0;
    for(const k in p.records) if(inRange(k)) c++;
    if(c === 0) return;
    ctx.fillStyle = fg;
    ctx.textAlign = 'left';
    ctx.fillText(p.name, 100, py);
    ctx.textAlign = 'right';
    ctx.fillStyle = fg2;
    ctx.fillText(c + ' 次', W - 100, py);
    py += 32;
  });
  ctx.textAlign = 'left';

  /* 月历（仅"本月"时画） */
  if(range === 'month'){
    const mode = state.settings.calMode || 'stripe';
    const calY = Math.max(py + 20, 560);
    const gx = 70, gw = W - 140;
    const cellW = gw / 7;
    const gap2 = 5;
    const cellH = cellW - gap2;

    ctx.fillStyle = fg3;
    ctx.font = '400 16px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    WEEK.forEach((w, i) => {
      ctx.fillText(w, gx + i*cellW + cellW/2, calY);
    });

    const gridY = calY + 30;
    const first = new Date(y, m, 1);
    const startDow = (first.getDay() + 6) % 7;
    const dim = new Date(y, m+1, 0).getDate();

    for(let i = 0; i < 42; i++){
      const d = i - startDow + 1;
      const col = i % 7, row = Math.floor(i / 7);
      const x = gx + col*cellW + gap2/2;
      const yy = gridY + row*(cellH + gap2);
      if(d < 1 || d > dim) continue;

      const key = dateKey(y, m, d);
      const onProjects = projectsOnDate(key);
      const r = 10;

      ctx.fillStyle = isDark ? '#2A2A2E' : '#F0EBE1';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x, yy, cellH, cellH, r);
      else ctx.rect(x, yy, cellH, cellH);
      ctx.fill();

      ctx.fillStyle = fg3;
      ctx.font = '400 13px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d, x + cellH/2, yy + 14);

      if(mode === 'tian' && onProjects.length > 0){
        const cnt = Math.min(onProjects.length, 5);
        const gs = cellH * 0.55;
        const gx2 = x + cellH/2 - gs/2;
        const gy2 = yy + cellH*0.32;
        ctx.save();
        ctx.translate(gx2, gy2);
        ctx.strokeStyle = fg;
        ctx.lineWidth = gs / 100 * 7;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for(let s = 0; s < cnt; s++){
          const [x1,y1,x2,y2] = STROKES[s];
          ctx.beginPath();
          ctx.moveTo(x1/100*gs, y1/100*gs);
          ctx.quadraticCurveTo((x1+x2)/2/100*gs, (y1+y2)/2/100*gs, x2/100*gs, y2/100*gs);
          ctx.stroke();
        }
        ctx.restore();
      }
      if(mode === 'stripe' && onProjects.length > 0){
        const maxShow = 3;
        const sh = 8;
        const sy = yy + cellH*0.35;
        onProjects.slice(0, maxShow).forEach((p, idx) => {
          const ry = sy + idx*(sh + 2);
          if(ry + sh > yy + cellH - 3) return;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          if(ctx.roundRect) ctx.roundRect(x + 3, ry, cellH - 6, sh, 3);
          else ctx.rect(x + 3, ry, cellH - 6, sh);
          ctx.fill();
        });
        if(onProjects.length > maxShow){
          ctx.fillStyle = fg2;
          ctx.font = '400 10px -apple-system,"PingFang SC",sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText('+' + (onProjects.length - maxShow), x + cellH - 4, yy + cellH - 4);
        }
      }
    }
    ctx.textAlign = 'left';
  }

  /* 底部：印章 + 正字台 */
  const sealSize = 56;
  const sealX = W - 100 - sealSize;
  const sealY = H - 100;
  ctx.strokeStyle = seal;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(sealX, sealY, sealSize, sealSize, 4);
  else ctx.rect(sealX, sealY, sealSize, sealSize);
  ctx.stroke();
  ctx.fillStyle = seal;
  ctx.font = '500 20px "STKaiti","KaiTi","Songti SC",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('正', sealX + sealSize/2, sealY + 16);
  ctx.fillText('字', sealX + sealSize/2, sealY + 40);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  ctx.fillStyle = fg3;
  ctx.font = '400 16px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('正字台 · 一笔一画，把日子写端正', 100, H - 80);

  cv.toBlob(async blob => {
    if(!blob) return;
    const file = new File([blob], `正字台-${y}${pad2(m+1)}.png`, { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: label }); return; } catch(e){}
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }, 'image/png');
}

  pageHost.appendChild(page);

  const grid = page.querySelector('#tianGrid');
  const maxShow = 300;
  const showFull = Math.min(full, maxShow);
  const frag = document.createDocumentFragment();
  for(let i = 0; i < showFull; i++){
    frag.appendChild(buildGlyph(5, seedFromKey('tian', i), 'var(--ink-soft)'));
  }
  if(part && showFull < maxShow){
    frag.appendChild(buildGlyph(part, seedFromKey('tian', showFull), 'var(--ink-soft)'));

  if(full > maxShow){
    const sp = document.createElement('span');
    sp.style.cssText = 'color:var(--text3);font-size:13px;padding:8px';
    sp.textContent = '…';
