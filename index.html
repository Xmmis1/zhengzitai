<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto" data-skin="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>正字台</title>
<script data-goatcounter="https://xmmis1.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --card3:#EDEDF0;
  --text:#1C1C1E; --text2:#8A8A8E; --text3:#C4C4C8;
  --sep:rgba(60,60,67,.08); --cell:#EFEFF4; --cell2:#E5E5EA;
  --accent:#5B7183; --nav:rgba(242,242,247,.82);
  --sheet:#FFFFFF; --ink:#1B1B1D; --danger:#C9564B;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --tabbar:rgba(242,242,247,.94);
  --paper:#FAF8F3;
  --ink-soft:#2A2622;
}
html[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#242427; --card3:#2A2A2E;
  --text:#FFFFFF; --text2:#98989E; --text3:#5A5A60;
  --sep:rgba(84,84,88,.5); --cell:#2A2A2E; --cell2:#333338;
  --accent:#93A9BC; --nav:rgba(20,20,22,.78);
  --sheet:#1C1C1E; --ink:#EDEAE4; --danger:#E06A5E;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  --tabbar:rgba(20,20,22,.94);
  --paper:#1A1815;
  --ink-soft:#E8E2D6;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#000000; --card:#1C1C1E; --card2:#242427; --card3:#2A2A2E;
    --text:#FFFFFF; --text2:#98989E; --text3:#5A5A60;
    --sep:rgba(84,84,88,.5); --cell:#2A2A2E; --cell2:#333338;
    --accent:#93A9BC; --nav:rgba(20,20,22,.78);
    --sheet:#1C1C1E; --ink:#EDEAE4; --danger:#E06A5E;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
    --tabbar:rgba(20,20,22,.94);
    --paper:#1A1815;
    --ink-soft:#E8E2D6;
  }
}
html[data-skin="green"]{
  --bg:#E8F0E4; --card:#F3F8F1; --card2:#EDF4EA; --card3:#E1EBDD;
  --text:#2A3B2A; --text2:#6B7D6B; --text3:#A3B3A3;
  --sep:rgba(60,80,60,.1); --cell:#E1EBDD; --cell2:#D4E2D0;
  --accent:#4E7A4E; --nav:rgba(232,240,228,.85);
  --sheet:#F3F8F1; --ink:#2A3B2A; --danger:#B85C4A;
  --tabbar:rgba(232,240,228,.94);
  --paper:#F0F6ED;
  --ink-soft:#2A3B2A;
}
html[data-skin="paper"]{
  --bg:#F5F0E6; --card:#FBF8F2; --card2:#F7F2E9; --card3:#EDE6D8;
  --text:#3D3630; --text2:#7D746A; --text3:#B5AC9E;
  --sep:rgba(80,70,50,.1); --cell:#EDE6D8; --cell2:#E3DBCB;
  --accent:#8A6D4B; --nav:rgba(245,240,230,.88);
  --sheet:#FBF8F2; --ink:#3D3630; --danger:#B85C4A;
  --tabbar:rgba(245,240,230,.94);
  --paper:#FBF8F2;
  --ink-soft:#3D3630;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  transition:background .3s,color .3s;
}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;}

.nav{
  position:sticky;top:0;z-index:20;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 6px;
  border-bottom:.5px solid transparent;
  transition:border-color .25s;
}
.nav.scrolled{border-bottom-color:var(--sep);}
.nav-row{display:flex;align-items:center;justify-content:space-between;height:40px;}
.app-title{font-size:20px;font-weight:700;letter-spacing:.5px;margin:0;color:var(--text);padding:0;}
.nav-actions{display:flex;gap:2px;}
.icon-btn{
  width:40px;height:40px;border-radius:20px;border:none;background:transparent;
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .18s;
}
.icon-btn:active{background:var(--sep);}
.icon-btn svg{width:22px;height:22px;}

.page-content{padding-bottom:calc(72px + env(safe-area-inset-bottom));}
.page-content.hide{display:none;}

.date-bar{
  display:flex;align-items:center;justify-content:center;
  padding:8px 16px 10px;gap:4px;
}
.date-arrow{
  width:34px;height:34px;border-radius:17px;border:none;background:transparent;
  color:var(--accent);font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
}
.date-arrow:active{background:var(--sep);}
.date-text{
  font-size:14.5px;font-weight:500;letter-spacing:.2px;
  min-width:200px;text-align:center;font-variant-numeric:tabular-nums;
}
.date-text .dim{color:var(--text2);font-weight:400;margin-left:4px;}
.today-btn{
  border:none;background:transparent;color:var(--accent);
  font-size:12.5px;font-family:inherit;padding:4px 8px;
  cursor:pointer;letter-spacing:.2px;border-radius:8px;
}
.today-btn:active{background:var(--sep);}
.today-btn.hide{display:none;}

.list{padding:0 16px 16px;}
.card{
  position:relative;background:var(--card);border-radius:20px;
  padding:14px 16px 16px;margin-bottom:11px;
  transition:box-shadow .3s,background .25s;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.card.open{box-shadow:var(--shadow);}
.card.done{background:color-mix(in srgb,var(--c) 8%,var(--card));}
.card.dragging{
  z-index:50;box-shadow:0 12px 36px rgba(0,0,0,.18);
  opacity:.96;transition:none;
}
.card.drag-placeholder{opacity:.3;}

.card-head{display:flex;align-items:center;gap:10px;}
.dot{
  width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent);
}
.names{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:6px;}
.pname{
  font-size:17px;font-weight:600;letter-spacing:.2px;margin:0;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tri{width:10px;height:10px;color:var(--text3);flex:none;transition:transform .3s;}
.card.open .tri{transform:rotate(180deg);}
.streak{
  font-size:12px;color:var(--text2);letter-spacing:.2px;
  font-variant-numeric:tabular-nums;flex:none;
}
.streak.hide{display:none;}
.head-edit{
  display:none;border:none;background:none;color:var(--text3);
  font-size:12.5px;letter-spacing:.2px;font-family:inherit;
  padding:4px 0;cursor:pointer;flex:none;
}
.head-edit:active{opacity:.5;}
.card.open .head-edit{display:block;}

.card-btn{
  flex:none;border:none;font-family:inherit;font-size:13px;
  padding:7px 14px;border-radius:16px;cursor:pointer;
  letter-spacing:.4px;font-weight:500;
  transition:transform .14s,background .2s,color .2s;
  white-space:nowrap;
}
.card-btn:active{transform:scale(.94);}
.card-btn.record{background:var(--c);color:#fff;}
.card-btn.record.dark-text{color:#2A2A2E;}
.card-btn.done{background:var(--cell);color:var(--text3);font-weight:400;}
.card.open .card-btn{display:none;}

@keyframes btnPop{0%{transform:scale(1);}45%{transform:scale(1.14);}100%{transform:scale(1);}}
.card-btn.pop{animation:btnPop .42s cubic-bezier(.34,1.56,.64,1);}

.zrows{margin-top:12px;cursor:pointer;}
.zrow{display:flex;align-items:center;gap:9px;min-height:22px;}
.zrow+.zrow{margin-top:5px;}
.zlabel{font-size:11px;color:var(--text3);width:26px;flex:none;letter-spacing:.5px;}
.zglyphs{display:flex;flex-wrap:wrap;gap:0;flex:1;min-width:0;align-items:center;}
.zglyphs svg{width:19px;height:19px;display:block;flex:none;}
.zglyphs .zmore{font-size:11px;color:var(--text3);margin-left:2px;}
.znum{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;flex:none;letter-spacing:.3px;}

.expand{height:0;overflow:hidden;transition:height .4s cubic-bezier(.32,.72,0,1);}
.expand-inner{overflow:hidden;}

.full-tian{padding-top:14px;border-top:.5px solid var(--sep);margin-top:14px;}
.full-tian-label{font-size:11px;color:var(--text3);letter-spacing:.5px;margin-bottom:8px;}
.full-tian-glyphs{
  display:flex;flex-wrap:wrap;gap:0;max-height:80px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);
}
.full-tian-glyphs svg{width:19px;height:19px;display:block;flex:none;}

.tag-stat{padding-top:14px;margin-top:14px;border-top:.5px solid var(--sep);}
.tag-stat-label{font-size:11px;color:var(--text3);letter-spacing:.5px;margin-bottom:8px;}
.tag-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.tag-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:10px;
  background:var(--cell);color:var(--text);
  font-size:12.5px;letter-spacing:.2px;
  border:none;font-family:inherit;
}
.tag-chip .tc-count{color:var(--text3);font-size:11.5px;font-variant-numeric:tabular-nums;}

.cal-wrap{padding-top:14px;}
.cal-head{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;position:relative;}
.cal-month{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.4px;min-width:96px;text-align:center;}
.cal-stat{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;position:absolute;right:0;}
.cal-nav{
  width:36px;height:36px;border-radius:18px;border:none;
  background:transparent;color:var(--accent);font-size:20px;
  line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
}
.cal-nav:active{background:var(--sep);}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;}
.weekdays span{text-align:center;font-size:10.5px;color:var(--text3);letter-spacing:.5px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;}
.cell{
  aspect-ratio:1;border-radius:10px;background:var(--cell);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;transition:background .18s,transform .14s;
  cursor:pointer;overflow:hidden;
}
.cell:active{transform:scale(.92);}
.cell.blank{background:transparent;pointer-events:none;}
.cell .d{font-size:14.5px;line-height:1;color:var(--text2);font-weight:400;font-variant-numeric:tabular-nums;}
.cell .l{font-size:8px;line-height:1;margin-top:2px;color:var(--text3);transform:scale(.92);}
.cell .l.hol{color:var(--danger);}
.cell.today{box-shadow:inset 0 0 0 1.6px var(--c);}
.cell.today .d{color:var(--c);font-weight:600;}
.cell.on{background:var(--c);}
.cell.on .d{color:#fff;font-weight:500;}
.cell.on .l{color:rgba(255,255,255,.72);}
.cell.on .l.hol{color:rgba(255,255,255,.92);}
.cell.on.dark .d{color:#2A2A2E;}
.cell.on.dark .l{color:rgba(42,42,46,.6);}
.cell.on.dark .l.hol{color:rgba(42,42,46,.85);}
.cell.today.on{box-shadow:none;}
.cell.future{border:1.5px dashed var(--cell2);}
.cell.future.on{opacity:.35;border:none;}
.cell .nd{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;}
.cell.on .nd{background:#fff;opacity:.85;}

.cal-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep);
  font-size:12px;color:var(--text2);
}
.cal-foot b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}

.add-card{
  width:100%;border:none;background:transparent;color:var(--text3);
  border-radius:20px;padding:18px;font-size:14.5px;letter-spacing:.4px;
  border:1.5px dashed var(--cell2);cursor:pointer;transition:all .2s;font-family:inherit;
}
.add-card:active{transform:scale(.985);color:var(--accent);border-color:var(--accent);}

.empty{text-align:center;padding:60px 20px;color:var(--text2);}
.empty .big{font-size:38px;margin-bottom:14px;color:var(--text3);font-weight:300;}
.empty p{font-size:14px;line-height:1.7;margin:0;}

.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;
  opacity:0;transition:opacity .3s;backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.mask.show{opacity:1;}

.modal{
  position:fixed;left:50%;top:50%;z-index:101;
  transform:translate(-50%,-50%) scale(.96);opacity:0;
  width:calc(100% - 48px);max-width:420px;max-height:82vh;overflow-y:auto;
  background:var(--sheet);border-radius:20px;padding:22px 20px;
  transition:transform .32s cubic-bezier(.32,.72,0,1),opacity .32s;
  -webkit-overflow-scrolling:touch;
}
.modal.show{transform:translate(-50%,-50%) scale(1);opacity:1;}

.modal-title{font-size:18px;font-weight:600;letter-spacing:.3px;margin:0 0 4px;}
.modal-sub{font-size:12.5px;color:var(--text2);margin-bottom:16px;letter-spacing:.2px;}
.form-row{margin-bottom:14px;}
.form-label{font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:.4px;}
.form-hint{font-size:11.5px;color:var(--text3);margin-top:6px;letter-spacing:.2px;line-height:1.5;}
.form-input{
  width:100%;padding:11px 14px;border-radius:12px;
  border:1.5px solid var(--cell2);background:var(--card2);
  color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s,background .2s;
}
.form-input:focus{border-color:var(--accent);background:var(--card);}
textarea.form-input{min-height:100px;line-height:1.6;resize:none;font-family:inherit;}

.num-row{display:flex;gap:8px;align-items:stretch;}
.num-row .form-input{flex:1;font-size:20px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;}
.sign-btn{
  width:52px;border:1.5px solid var(--cell2);background:var(--card2);
  border-radius:12px;font-size:22px;color:var(--accent);
  font-family:inherit;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.sign-btn:active{background:var(--cell);}
.sign-btn.minus{color:var(--danger);}

.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.sw{aspect-ratio:1;border-radius:50%;border:2.5px solid transparent;cursor:pointer;position:relative;transition:transform .18s;padding:0;}
.sw:active{transform:scale(.9);}
.sw.on{border-color:var(--text);}
.sw.on::after{content:'';position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.1);}

.unit-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.unit-chip{
  padding:5px 11px;border-radius:14px;background:var(--cell);
  color:var(--text2);font-size:12.5px;letter-spacing:.2px;
  cursor:pointer;border:none;font-family:inherit;
  transition:transform .14s,background .14s;
}
.unit-chip:active{transform:scale(.94);background:var(--cell2);}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px;}
.chip{
  padding:7px 13px;border-radius:16px;background:var(--cell);
  color:var(--text2);font-size:13px;letter-spacing:.2px;
  cursor:pointer;border:none;font-family:inherit;
  transition:transform .16s,background .16s;
}
.chip:active{transform:scale(.94);background:var(--cell2);}
.chip.recommend{background:color-mix(in srgb,var(--accent) 14%,var(--cell));color:var(--accent);}

.modal-actions{display:flex;gap:10px;margin-top:18px;}
.btn{
  flex:1;padding:13px;border-radius:13px;border:none;
  font-size:15px;font-weight:500;letter-spacing:.3px;
  font-family:inherit;cursor:pointer;transition:transform .16s,opacity .2s;
}
.btn:active{transform:scale(.97);opacity:.85;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.ghost{background:var(--cell);color:var(--text);}
.btn.danger{background:transparent;color:var(--danger);}

.page{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.page.show{transform:none;}
.page.no-anim{transition:none;transform:none;}
.page-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);flex:none;
}
.back-btn{
  border:none;background:none;color:var(--accent);font-size:16px;
  font-family:inherit;padding:4px 0;cursor:pointer;
  display:flex;align-items:center;gap:2px;letter-spacing:.2px;
}
.back-btn:active{opacity:.5;}
.back-btn svg{width:17px;height:17px;}
.page-title{font-size:17px;font-weight:600;letter-spacing:.3px;}

.switch{
  width:51px;height:31px;border-radius:16px;background:var(--cell2);
  position:relative;transition:background .25s;flex:none;cursor:pointer;border:none;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);
  transition:transform .25s cubic-bezier(.32,.72,0,1);
}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(20px);}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--tabbar);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.tabbar.hide{transform:translateY(100%);}
.tab-item{
  flex:1;border:none;background:none;font-family:inherit;
  padding:8px 0 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text3);transition:color .18s;
}
.tab-item.on{color:var(--accent);}
.tab-item svg{width:24px;height:24px;}
.tab-item span{font-size:10.5px;letter-spacing:.2px;}

.mode-toggle{display:flex;background:var(--cell);border-radius:9px;padding:2px;gap:2px;}
.mode-toggle button{
  border:none;background:transparent;color:var(--text);font-size:12.5px;
  padding:6px 12px;border-radius:7px;font-family:inherit;cursor:pointer;
  transition:background .2s;letter-spacing:.2px;
}
.mode-toggle button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500;}

.field{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(40px + env(safe-area-inset-bottom));}

.big-cal .cell{aspect-ratio:1;}
.big-cal .cell .d{font-size:12px;margin-bottom:2px;}
.big-cal .cell .tian-mini{width:100%;display:flex;justify-content:center;}
.big-cal .cell .tian-mini svg{width:22px;height:22px;}
.big-cal .cell .stripes{display:flex;flex-direction:column;gap:1.5px;width:100%;padding:0 2px;overflow:hidden;}
.big-cal .cell .stripe{height:4px;border-radius:2px;width:100%;position:relative;}
.big-cal .cell .stripe-txt{font-size:7px;line-height:4px;color:#fff;text-align:center;white-space:nowrap;overflow:hidden;letter-spacing:0;position:absolute;inset:0;}
.big-cal .cell .more-num{font-size:7px;color:var(--text3);text-align:right;line-height:1;margin-top:1px;}

.progress-bar{height:8px;border-radius:4px;background:var(--cell);overflow:hidden;margin-top:8px;}
.progress-bar i{display:block;height:100%;border-radius:4px;background:var(--c);transition:width .5s cubic-bezier(.32,.72,0,1);}
.progress-bar.done i{background:#C9A961;}

.progress-num{font-size:22px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}

<script>
const STORAGE_KEY = 'zhengzitai.v1';
const COLORS = ['#6FA3A0','#7A93B8','#A98BB0','#C08A7E','#C2A46B','#85A085','#8794A8','#B8735E','#8A9A6B','#B98A94'];
const WEEK = ['一','二','三','四','五','六','日'];

const MODULES = {
  '纳新': ['读书','看视频','听课','观察'],
  '成事': ['写作','做 App','做美食','分享'],
  '健体': ['跑步','力量','马甲线','拉伸'],
  '修睦': ['陪家人','联系朋友','帮助他人'],
  '将息': ['冥想','散步','独处','放松']
};
const MODULE_MEANINGS = {
  '纳新': '吸收新的东西',
  '成事': '创造、表达、完成',
  '健体': '锻炼身体',
  '修睦': '与人连接、和睦相处',
  '将息': '休息、恢复'
};

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pad2 = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dateKey = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;
const todayKey = () => { const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); };

function luminance(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}
function rgba(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function fmtNum(n){
  if(Number.isInteger(n)) return String(n);
  return String(Math.round(n * 100) / 100);
}
function recommendTags(project){
  const preset = MODULES[project.name] || [];
  const hist = new Set();
  for(const k in project.records){
    const t = project.records[k].tag;
    if(t) hist.add(t);
  }
  const all = [];
  preset.forEach(t => all.push({ tag: t, recommend: true }));
  [...hist].forEach(t => {
    if(!preset.includes(t)) all.push({ tag: t, recommend: false });
  });
  return all;
}

const DEFAULT_STATE = {
  name: '正字台',
  settings: {
    theme: 'auto', skin: 'default',
    lunar: true, holiday: true, calMode: 'stripe',
    hintRecorded: false, onboarded: false
  },
  projects: [], progress: [], trash: [], archived: []
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const merged = Object.assign(clone(DEFAULT_STATE), parsed, {
        settings: Object.assign(clone(DEFAULT_STATE.settings), parsed.settings || {})
      });
      if(!Array.isArray(merged.progress)) merged.progress = [];
      if(!Array.isArray(merged.archived)) merged.archived = [];
      return merged;
    }
  }catch(e){}
  return clone(DEFAULT_STATE);
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

function findProject(id){ return state.projects.find(p => p.id === id); }
function addProject(name, color){
  const p = { id: uid(), name: name || '未命名', color: color || COLORS[state.projects.length % COLORS.length], records: {} };
  state.projects.push(p); saveState(); return p;
}
function updateProject(id, patch){ const p = findProject(id); if(!p) return null; Object.assign(p, patch); saveState(); return p; }
function removeProject(id){
  const p = findProject(id); if(!p) return;
  state.trash.push({ kind:'project', data: clone(p), deletedAt: Date.now() });
  state.projects = state.projects.filter(x => x.id !== id);
  saveState();
}
function archiveProject(id){
  const p = findProject(id); if(!p) return;
  state.archived.push({ kind:'project', data: clone(p), archivedAt: Date.now() });
  state.projects = state.projects.filter(x => x.id !== id);
  saveState();
}
function restoreProject(id){
  const idx = state.archived.findIndex(a => a.data && a.data.id === id);
  if(idx < 0) return;
  state.projects.push(state.archived[idx].data);
  state.archived.splice(idx, 1);
  saveState();
}

function getRecord(project, key){ return project.records[key] || null; }
function hasRecord(project, key){ return !!project.records[key]; }
function setRecord(project, key){
  if(project.records[key]) return;
  project.records[key] = { t: Date.now(), note: '', tag: '' };
  saveState();
}
function removeRecord(project, key){ if(!project.records[key]) return; delete project.records[key]; saveState(); }
function setNote(project, key, note){ if(!project.records[key]) return; project.records[key].note = note; saveState(); }
function setTag(project, key, tag){ if(!project.records[key]) return; project.records[key].tag = tag; saveState(); }

function countMonth(project, year, month){
  const pre = `${year}-${pad2(month+1)}-`;
  let n = 0;
  for(const k in project.records) if(k.startsWith(pre)) n++;
  return n;
}
function countTotal(project){ return Object.keys(project.records).length; }
function streakOf(project){
  let n = 0;
  const t = new Date();
  const cur = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  if(!project.records[dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate())]) cur.setDate(cur.getDate() - 1);
  while(true){
    const k = dateKey(cur.getFullYear(), cur.getMonth(), cur.getDate());
    if(project.records[k]){ n++; cur.setDate(cur.getDate() - 1); }
    else break;
    if(n > 3650) break;
  }
  return n;
}
function allProjectsIncludingArchived(){
  const list = [...state.projects];
  state.archived.forEach(a => { if(a.kind === 'project' && a.data) list.push(a.data); });
  return list;
}
function projectsOnDate(dateKeyStr){
  return allProjectsIncludingArchived().filter(p => hasRecord(p, dateKeyStr));
}
function allTimeStats(){
  const daySet = new Set();
  let count = 0;
  for(const p of allProjectsIncludingArchived()){
    for(const k in p.records){ daySet.add(k); count++; }
  }
  return { days: daySet.size, count };
}
function collectTags(){
  const map = {};
  for(const p of state.projects){
    for(const k in p.records){
      const t = p.records[k].tag;
      if(!t) continue;
      if(!map[t]) map[t] = { tag: t, count: 0, lastDate: '', projects: {} };
      map[t].count++;
      if(!map[t].lastDate || k > map[t].lastDate) map[t].lastDate = k;
      map[t].projects[p.name] = (map[t].projects[p.name] || 0) + 1;
    }
  }
  return Object.values(map).sort((a,b) => b.count - a.count);
}

const STROKES = [
  [15,20, 85,20],
  [50,20, 50,80],
  [50,50, 75,50],
  [25,40, 25,80],
  [12,80, 88,80]
];
function seedFromKey(key, index){
  let h = 0;
  for(let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) | 0;
  return Math.abs(h) + index * 7919;
}
function rng(seed){
  let a = seed | 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

function buildGlyph(count, seed, color){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  const rand = rng(seed);
  svg.style.transform = `rotate(${(rand()-0.5)*1.4}deg)`;
  for(let i = 0; i < count; i++){
    const [x1,y1,x2,y2] = STROKES[i];
    const jx1 = x1 + (rand()-0.5)*1.4;
    const jy1 = y1 + (rand()-0.5)*1.4;
    const jx2 = x2 + (rand()-0.5)*1.4;
    const jy2 = y2 + (rand()-0.5)*1.4;
    const mx = (jx1+jx2)/2, my = (jy1+jy2)/2;
    const dx = jx2-jx1, dy = jy2-jy1;
    const len = Math.hypot(dx,dy) || 1;
    const bow = (rand()-0.5)*1.8;
    const cx = mx - dy/len*bow, cy = my + dx/len*bow;
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M${jx1.toFixed(1)} ${jy1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${jx2.toFixed(1)} ${jy2.toFixed(1)}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color || 'var(--ink)');
    path.setAttribute('stroke-width', i === 0 || i === 4 ? 6.4 : (i === 1 ? 7.2 : 7.0));
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('opacity', '0.94');
    svg.appendChild(path);
  }
  return svg;
}
function renderGlyphs(el, n, keyPrefix, cap, color){
  el.innerHTML = '';
  const max = cap || 12;
  if(n === 0){
    const sp = document.createElement('span');
    sp.className = 'zmore';
    sp.textContent = '还没开始';
    sp.style.fontSize = '11.5px';
    el.appendChild(sp);
    return;
  }
  const full = Math.floor(n / 5);
  const part = n % 5;
  const showFull = Math.min(full, max);
  const frag = document.createDocumentFragment();
  for(let i = 0; i < showFull; i++) frag.appendChild(buildGlyph(5, seedFromKey(keyPrefix, i), color));
  if(part && showFull < max) frag.appendChild(buildGlyph(part, seedFromKey(keyPrefix, showFull), color));
  if(full > max){
    const sp = document.createElement('span');
    sp.className = 'zmore';
    sp.textContent = '…';
    frag.appendChild(sp);
  }
  el.appendChild(frag);
}

function lYearDays(y){ let sum = 348; for(let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y-1900] & i) ? 1 : 0; return sum + leapDays(y); }
function leapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function leapDays(y){ return leapMonth(y) ? ((LUNAR_INFO[y-1900] & 0x10000) ? 30 : 29) : 0; }
function monthDays(y,m){ return (LUNAR_INFO[y-1900] & (0x10000 >> m)) ? 30 : 29; }
function solar2lunar(y, m, d){
  let offset = Math.round((Date.UTC(y, m-1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  let i, temp = 0;
  for(i = 1900; i < 2101 && offset > 0; i++){ temp = lYearDays(i); offset -= temp; }
  if(offset < 0){ offset += temp; i--; }
  const ly = i, leap = leapMonth(i);
  let isLeap = false;
  for(i = 1; i < 13 && offset > 0; i++){
    if(leap > 0 && i === leap + 1 && !isLeap){ --i; isLeap = true; temp = leapDays(ly); }
    else { temp = monthDays(ly, i); }
    if(isLeap && i === leap + 1) isLeap = false;
    offset -= temp;
  }
  if(offset === 0 && leap > 0 && i === leap + 1){ if(isLeap) isLeap = false; else { isLeap = true; --i; } }
  if(offset < 0){ offset += temp; --i; }
  return { y: ly, m: i, d: offset + 1, leap: isLeap };
}
function qingmingDay(y){ const yy = y % 100; return Math.floor(yy * 0.2422 + 4.81) - Math.floor((yy - 1) / 4); }
function getHoliday(y, m, d){
  if(m === 0 && d === 1) return '元旦';
  if(m === 4 && d === 1) return '劳动节';
  if(m === 9 && d === 1) return '国庆';
  if(m === 3 && d === qingmingDay(y)) return '清明';
  const l = solar2lunar(y, m+1, d);
  if(!l.leap){
    if(l.m === 1 && l.d === 1) return '春节';
    if(l.m === 1 && l.d === 15) return '元宵';
    if(l.m === 5 && l.d === 5) return '端午';
    if(l.m === 8 && l.d === 15) return '中秋';
  }
  if(l.m === 12 && l.d === monthDays(l.y, 12)) return '除夕';
  return null;
}
function lunarLabel(y, m, d){
  const l = solar2lunar(y, m+1, d);
  if(l.d === 1) return (l.leap ? '闰' : '') + L_MON[l.m] + '月';
  return L_DAY[l.d] || '';
}

function findProgress(id){ return state.progress.find(p => p.id === id); }
function addProgress({name, color, unit, target, pinned}){
  const p = {
    id: uid(), name: name || '未命名',
    color: color || COLORS[state.progress.length % COLORS.length],
    unit: unit || '', target: target || 0, current: 0,
    pinned: !!pinned, records: []
  };
  state.progress.push(p); saveState(); return p;
}
function updateProgress(id, patch){
  const p = findProgress(id); if(!p) return null;
  Object.assign(p, patch); saveState(); return p;
}
function removeProgress(id){
  const p = findProgress(id); if(!p) return;
  state.trash.push({ kind:'progress', data: clone(p), deletedAt: Date.now() });
  state.progress = state.progress.filter(x => x.id !== id);
  saveState();
}
function archiveProgress(id){
  const p = findProgress(id); if(!p) return;
  state.archived.push({ kind:'progress', data: clone(p), archivedAt: Date.now() });
  state.progress = state.progress.filter(x => x.id !== id);
  saveState();
}
function restoreProgress(id){
  const idx = state.archived.findIndex(a => a.data && a.data.id === id && a.kind === 'progress');
  if(idx < 0) return;
  state.progress.push(state.archived[idx].data);
  state.archived.splice(idx, 1);
  saveState();
}
function addProgressRecord(id, value, tag, dateKeyStr){
  const p = findProgress(id); if(!p) return;
  if(value === 0) return;
  let t = Date.now();
  if(dateKeyStr){
    const [y, m, d] = dateKeyStr.split('-').map(Number);
    t = new Date(y, m-1, d, 12, 0, 0).getTime();
  }
  p.records.push({ t, value, tag: tag || '' });
  p.current = p.current + value;
  saveState();
}
function removeProgressRecord(id, idx){
  const p = findProgress(id); if(!p) return;
  const rec = p.records[idx]; if(!rec) return;
  p.records.splice(idx, 1);
  p.current = p.current - rec.value;
  saveState();
}
function updateProgressRecord(id, idx, value, tag){
  const p = findProgress(id); if(!p) return;
  const rec = p.records[idx]; if(!rec) return;
  const old = rec.value;
  rec.value = value; rec.tag = tag || '';
  p.current = p.current - old + value;
  saveState();
}
function progressPct(p){
  if(p.target <= 0) return 0;
  return Math.max(0, p.current / p.target * 100);
}
function isProgressDone(p){ return p.target > 0 && p.current >= p.target; }
function progressTags(p){
  const set = new Set();
  p.records.forEach(r => { if(r.tag) set.add(r.tag); });
  return [...set];
}
function progressMonthStats(p, year, month){
  const pre = `${year}-${pad2(month+1)}-`;
  let sum = 0, count = 0;
  const tagMap = {};
  p.records.forEach(r => {
    const d = new Date(r.t);
    const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    if(k.startsWith(pre)){
      sum += r.value; count++;
      if(r.tag) tagMap[r.tag] = (tagMap[r.tag] || 0) + r.value;
    }
  });
  return { sum, count, tagMap };
}

function tagStatsOfMonth(p, y, m){

}

      const dir = parseInt(btn.dataset.dir);
      let ny = cm.y, nm = cm.m + dir;
      if(nm < 0){ nm = 11; ny--; }
      if(nm > 11){ nm = 0; ny++; }
      cm.y = ny; cm.m = nm;
      const card = listEl.querySelector(`.card[data-id="${p.id}"]`);
      if(card) renderCardExpand(card, p);
    });
  });
  const wd = document.createElement('div');
  wd.className = 'weekdays';
  wd.innerHTML = WEEK.map(w => `<span>${w}</span>`).join('');
  wrap.appendChild(wd);
  wrap.appendChild(buildMonthGrid(p, cm.y, cm.m));
  const foot = document.createElement('div');
  foot.className = 'cal-foot';
  wrap.appendChild(foot);
  updateCalStat(wrap, p, cm.y, cm.m);
  return wrap;
}
function updateCalStat(wrap, p, y, m){
  const mc = countMonth(p, y, m);
  const dim = new Date(y, m+1, 0).getDate();
  const rate = Math.round(mc / dim * 100);
  const stat = wrap.querySelector('.cal-stat');
  if(stat) stat.textContent = `${mc} 次`;
  const foot = wrap.querySelector('.cal-foot');
  if(foot) foot.innerHTML = `<span>本月打卡 <b>${mc}</b> 次</span><span>完成率 <b>${rate}%</b></span>`;
}
function buildMonthGrid(p, y, m){
  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const dim = new Date(y, m+1, 0).getDate();
  const tk = todayKey();
  const isLight = luminance(p.color) > 0.62;
  for(let i = 0; i < 42; i++){
    const d = i - startDow + 1;
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(d < 1 || d > dim){ cell.classList.add('blank'); grid.appendChild(cell); continue; }
    const key = dateKey(y, m, d);
    const rec = getRecord(p, key);
    const isFuture = key > tk;
    cell.dataset.k = key;
    if(key === tk) cell.classList.add('today');
    if(isFuture) cell.classList.add('future');
    if(rec){
      cell.classList.add('on');
      if(isFuture){ cell.style.background = rgba(p.color, 0.28); cell.classList.add('dark'); }
      else { cell.style.background = p.color; if(isLight) cell.classList.add('dark'); }
      if(rec.note && rec.note.trim()){
        const nd = document.createElement('span');
        nd.className = 'nd'; cell.appendChild(nd);
      }
    }
    const dEl = document.createElement('span');
    dEl.className = 'd'; dEl.textContent = d;
    cell.appendChild(dEl);
    let sub = null, isHol = false;
    if(state.settings.holiday){ const h = getHoliday(y, m, d); if(h){ sub = h; isHol = true; } }
    if(!sub && state.settings.lunar) sub = lunarLabel(y, m, d);
    if(sub){
      const lEl = document.createElement('span');
      lEl.className = 'l' + (isHol ? ' hol' : '');
      lEl.textContent = sub.length > 3 ? sub.slice(0,3) : sub;
      lEl.style.transform = `scale(${sub.length > 2 ? 0.82 : 0.92})`;
      cell.appendChild(lEl);
    }
    cell.addEventListener('click', (e) => { e.stopPropagation(); onCellClick(p, key, cell); });
    grid.appendChild(cell);
  }
  return grid;
}
function onCellClick(p, key, cellEl){
  if(hasRecord(p, key)){ openRecordModal(p.id, key); return; }
  setRecord(p, key);
  applyCellStyle(cellEl, p, key);
  if(!state.settings.hintRecorded){
    state.settings.hintRecorded = true;
    saveState();
    coach('已记 · 再点一下格子，可以写备注和标签');
  }
  const card = listEl.querySelector(`.card[data-id="${p.id}"]`);
  if(card){
    fillCardGlyphs(card, p);
    refreshCardButton(card, p);
    refreshStreak(card, p);
    const wrap = cellEl.closest('.cal-wrap');
    if(wrap){
      const cm = view.calMonth[p.id] || { y: view.year, m: view.month };
      updateCalStat(wrap, p, cm.y, cm.m);
    }
    if(view.openProjectId === p.id){
      requestAnimationFrame(() => { card._refs.expand.style.height = card._refs.inner.scrollHeight + 'px'; });
    }
  }
}
function applyCellStyle(cell, p, key){
  const rec = getRecord(p, key);
  const tk = todayKey();
  const isFuture = key > tk;
  const isLight = luminance(p.color) > 0.62;
  cell.classList.remove('on','dark');
  cell.style.background = '';
  if(rec){
    cell.classList.add('on');
    if(isFuture){ cell.style.background = rgba(p.color, 0.28); cell.classList.add('dark'); }
    else { cell.style.background = p.color; if(isLight) cell.classList.add('dark'); }
  }
  let nd = cell.querySelector('.nd');
  const hasNote = rec && rec.note && rec.note.trim();
  if(hasNote && !nd){ nd = document.createElement('span'); nd.className = 'nd'; cell.appendChild(nd); }
  else if(!hasNote && nd){ nd.remove(); }
}

function buildProgressCard(p){

  const pct = progressPct(p);

  const hasTarget = p.target > 0;

  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `
    <span class="dot"></span>
    <div class="names">
      <h3 class="pname">${esc(p.name)}</h3>
      <svg class="tri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <button class="head-edit" data-edit>编辑</button>
    <button class="card-btn record" data-btn>记</button>
  `;
  el.appendChild(head);

  const body = document.createElement('div');
  body.style.marginTop = '12px';
  body.style.cursor = 'pointer';
  let bodyHTML = `
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <div>
        <span class="progress-num">${fmtNum(p.current)}</span>
        ${hasTarget ? `<span class="progress-unit">/ ${fmtNum(p.target)}${p.unit ? ' ' + esc(p.unit) : ''}</span>` : (p.unit ? `<span class="progress-unit">${esc(p.unit)}</span>` : '')}
      </div>
      ${hasTarget ? `<span style="font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums">${Math.round(pct)}%</span>` : ''}
    </div>
  `;
  if(hasTarget){
    bodyHTML += `<div class="progress-bar${done?' done':''}"><i style="width:${Math.min(pct,100)}%"></i></div>`;
    if(done) bodyHTML += `<div style="font-size:12px;color:#C9A961;margin-top:8px;letter-spacing:.3px">✦ 已达成</div>`;
  }
  body.innerHTML = bodyHTML;
  el.appendChild(body);

  const expand = document.createElement('div');
  expand.className = 'expand';
  const inner = document.createElement('div');
  inner.className = 'expand-inner';
  expand.appendChild(inner);
  el.appendChild(expand);
  el._refs = { expand, inner, head, body };

  head.querySelector('[data-edit]').addEventListener('click', (e) => {
    e.stopPropagation(); openProgressModal(p.id);
  });
  head.querySelector('[data-btn]').addEventListener('click', (e) => {
    e.stopPropagation(); openProgressRecordModal(p.id);
  });
  head.querySelector('.names').addEventListener('click', (e) => { e.stopPropagation(); toggleProgressCard(p.id); });
  body.addEventListener('click', (e) => { e.stopPropagation(); toggleProgressCard(p.id); });

  return el;
}

function openRecordActions(progressId, idx){
  const p = findProgress(progressId); if(!p) return;
  const rec = p.records[idx]; if(!rec) return;
  const d = new Date(rec.t);
  openModal(modal => {
    modal.innerHTML = `
      <h3 class="modal-title">${d.getMonth()+1}月${d.getDate()}日</h3>
      <div class="modal-sub">${rec.tag ? '[' + esc(rec.tag) + '] ' : ''}${rec.value > 0 ? '+' : ''}${fmtNum(rec.value)}${p.unit ? ' ' + esc(p.unit) : ''}</div>
      <div class="form-label">数量</div>
      <div class="num-row">
        <button class="sign-btn" id="signBtn">${rec.value >= 0 ? '+' : '−'}</button>
        <input class="form-input" id="valInput" type="text" inputmode="decimal" value="${Math.abs(rec.value)}" autocomplete="off">
        <span style="display:flex;align-items:center;padding:0 8px;color:var(--text2);font-size:14px">${esc(p.unit)}</span>
      </div>
      <div class="form-row" style="margin-top:14px">
        <div class="form-label">标签（可选）</div>
        <input class="form-input" id="tagInput" value="${esc(rec.tag || '')}" placeholder="如：工资、收租">
      </div>
      <div class="modal-actions" style="margin-top:18px">
        <button class="btn ghost" id="btnDel" style="color:var(--danger)">删除</button>
        <button class="btn ghost" id="btnCancel">取消</button>
        <button class="btn primary" id="btnOk">保存</button>
      </div>
    `;
    const valIn = modal.querySelector('#valInput');
    const tagIn = modal.querySelector('#tagInput');
    const signBtn = modal.querySelector('#signBtn');
    let sign = rec.value >= 0 ? 1 : -1;
    signBtn.addEventListener('click', () => {
      sign = -sign;
      signBtn.textContent = sign === 1 ? '+' : '−';
      signBtn.classList.toggle('minus', sign === -1);
    });
    modal.querySelector('#btnCancel').addEventListener('click', closeModal);
    modal.querySelector('#btnOk').addEventListener('click', () => {
      const raw = parseFloat(valIn.value);
      if(!raw || isNaN(raw)){ toast('请输入数量'); return; }
      updateProgressRecord(p.id, idx, raw * sign, tagIn.value.trim());
      closeModal();
      setTimeout(() => { renderProgressList(); openProgressCard(p.id); }, 200);
    });
    modal.querySelector('#btnDel').addEventListener('click', () => {
      if(!confirm('删除这条记录？')) return;
      removeProgressRecord(p.id, idx);
      closeModal();
      setTimeout(() => { renderProgressList(); openProgressCard(p.id); }, 200);
    });
  });
}

function openRecordModal(projectId, dateKeyStr){
  const p = findProject(projectId);
  if(!p) return;
  let rec = getRecord(p, dateKeyStr);
  const isChecked = !!rec;

  const [yy, mm, dd] = dateKeyStr.split('-').map(Number);
  const d = new Date(yy, mm-1, dd);
  const week = '日一二三四五六'[d.getDay()];
  const isFuture = dateKeyStr > todayKey();

  openModal(modal => {
    let sub = '';
    if(rec){
      const time = new Date(rec.t);
      sub = `已打卡 · ${pad2(time.getHours())}:${pad2(time.getMinutes())}${isFuture ? ' · 预打卡' : ''}`;
    }else{
      sub = isFuture ? '还没到 · 预打卡' : '尚未打卡';
    }

    modal.innerHTML = `
      <h3 class="modal-title">${mm}月${dd}日 周${week}</h3>
      <div class="modal-sub">${sub}</div>
      <div class="form-label">备注</div>
      <textarea class="form-input" id="noteInput" placeholder="写点什么…"></textarea>
      <div class="form-label" style="margin-top:14px">标签（可选）</div>
      <input class="form-input" id="tagInput" placeholder="如：读书、跑步">
      <div class="chips" id="chipRow"></div>
      <div class="modal-actions">
        <button class="btn danger" id="btnRemove" style="${isChecked ? '' : 'display:none'}">取消打卡</button>
        <button class="btn primary" id="btnCheck">${isChecked ? '完成' : '打卡'}</button>
      </div>
    `;

    const ta = modal.querySelector('#noteInput');
    const tagIn = modal.querySelector('#tagInput');
    ta.value = rec ? (rec.note || '') : '';
    tagIn.value = rec ? (rec.tag || '') : '';

    let saveTimer = null;
    const save = () => {
      if(!rec) return;
      setNote(p, dateKeyStr, ta.value);
      setTag(p, dateKeyStr, tagIn.value.trim());
    };
    const debounceSave = () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 350);
    };
    ta.addEventListener('input', debounceSave);
    tagIn.addEventListener('input', debounceSave);

    const chipRow = modal.querySelector('#chipRow');
    const tags = recommendTags(p);
    tags.slice(0, 10).forEach(item => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (item.recommend ? ' recommend' : '');
      chip.textContent = item.tag;
      chip.addEventListener('click', (e) => {
        e.preventDefault();
        tagIn.value = item.tag;
        debounceSave();
      });
      chipRow.appendChild(chip);
    });

    modal.querySelector('#btnCheck').addEventListener('click', () => {
      if(!rec){
        setRecord(p, dateKeyStr);
        rec = getRecord(p, dateKeyStr);
      }
      save();
      closeModal();
      const card = listEl.querySelector(`.card[data-id="${p.id}"]`);
      if(card){ fillCardGlyphs(card, p); refreshCardButton(card, p); refreshStreak(card, p); }
      checkMilestones(p);
      refreshTagPagesIfOpen();
    });

    modal.querySelector('#btnRemove').addEventListener('click', () => {
      if(rec && ((rec.note && rec.note.trim()) || (rec.tag && rec.tag.trim()))){
        if(!confirm('这条记录有内容，取消打卡会一起删掉。确定吗？')) return;
      }
      removeRecord(p, dateKeyStr);
      closeModal();
      const card = listEl.querySelector(`.card[data-id="${p.id}"]`);
      if(card){ fillCardGlyphs(card, p); refreshCardButton(card, p); refreshStreak(card, p); }
      refreshTagPagesIfOpen();
    });
  });
}

function checkMilestones(p){
  const total = countTotal(p);
  const st = streakOf(p);
  const milestones = [
    { cond: total === 1, msg: `「${p.name}」的第一笔，写下了` },
    { cond: total === 5, msg: `「${p.name}」写完第一个正字了` },
    { cond: total === 10, msg: `「${p.name}」写了 2 个正字` },
    { cond: total === 25, msg: `「${p.name}」写了 5 个正字` },
    { cond: total === 50, msg: `「${p.name}」写了 10 个正字` },
    { cond: st === 7, msg: `「${p.name}」连续 7 天` },
    { cond: st === 30, msg: `「${p.name}」连续 30 天` },
    { cond: st === 100, msg: `「${p.name}」连续 100 天` },
    { cond: st === 365, msg: `「${p.name}」连续一整年` }
  ];
  for(const m of milestones){
    if(m.cond){ setTimeout(() => coach(m.msg), 400); return; }
  }

function openProgressRecordModal(id){
  const p = findProgress(id);
  if(!p) return;
  let selectedDate = todayKey();
  let calView = { y: view.year, m: view.month };

  openModal(modal => {
    modal.innerHTML = `
      <h3 class="modal-title">${esc(p.name)}</h3>
      <div class="modal-sub">当前 ${fmtNum(p.current)}${p.unit ? ' ' + esc(p.unit) : ''}</div>
      <div class="form-label">数量</div>
      <div class="num-row">
        <button class="sign-btn" id="signBtn">+</button>
        <input class="form-input" id="valInput" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
        <span style="display:flex;align-items:center;padding:0 8px;color:var(--text2);font-size:14px">${esc(p.unit)}</span>
      </div>
      <div class="form-row" style="margin-top:14px">
        <div class="form-label">日期</div>
        <div class="date-picker-row" id="datePickerRow">
          <span class="dp-label">记在</span>
          <span class="dp-value" id="dpValue">今天</span>
          <span class="dp-arrow">›</span>
        </div>
        <div id="dpPanel" style="display:none;margin-top:8px">
          <div class="dp-nav">
            <button id="dpPrev">‹</button>
            <span class="dp-month" id="dpMonth"></span>
            <button id="dpNext">›</button>
          </div>
          <div class="weekdays" style="margin-top:10px;margin-bottom:5px">
            ${WEEK.map(w => `<span>${w}</span>`).join('')}
          </div>
          <div class="dp-grid" id="dpGrid"></div>
        </div>
      </div>
      <div class="form-row" style="margin-top:14px">
        <div class="form-label">标签（可选）</div>
        <input class="form-input" id="tagInput" placeholder="如：工资、收租">
      </div>
      <div class="chips" id="tagChips"></div>
      <div class="form-hint">填了标签，展开后可以按标签看合计</div>
      <div class="modal-actions">
        <button class="btn ghost" id="btnCancel">取消</button>
        <button class="btn primary" id="btnOk">记一笔</button>
      </div>
    `;
    const valIn = modal.querySelector('#valInput');
    const tagIn = modal.querySelector('#tagInput');
    const signBtn = modal.querySelector('#signBtn');
    const dpRow = modal.querySelector('#datePickerRow');
    const dpPanel = modal.querySelector('#dpPanel');
    const dpValue = modal.querySelector('#dpValue');
    const dpMonth = modal.querySelector('#dpMonth');
    const dpGrid = modal.querySelector('#dpGrid');

    const updateDpValue = () => {
      if(selectedDate === todayKey()) dpValue.textContent = '今天';
      else {
        const [y, m, d] = selectedDate.split('-').map(Number);
        dpValue.textContent = `${m}月${d}日`;
      }
    };
    updateDpValue();

    const renderDpGrid = () => {
      dpMonth.textContent = `${calView.y}年${calView.m+1}月`;
      dpGrid.innerHTML = '';
      const first = new Date(calView.y, calView.m, 1);
      const startDow = (first.getDay() + 6) % 7;
      const dim = new Date(calView.y, calView.m+1, 0).getDate();
      const tk = todayKey();
      for(let i = 0; i < 42; i++){
        const d = i - startDow + 1;
        const cell = document.createElement('div');
        cell.className = 'dp-cell';
        if(d < 1 || d > dim){ cell.classList.add('blank'); dpGrid.appendChild(cell); continue; }
        const key = dateKey(calView.y, calView.m, d);
        if(key === selectedDate) cell.classList.add('on');
        if(key === tk) cell.classList.add('today');
        if(key > tk){ cell.style.opacity = '.35'; cell.style.pointerEvents = 'none'; }
        cell.textContent = d;
        cell.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedDate = key;
          updateDpValue();
          renderDpGrid();
        });
        dpGrid.appendChild(cell);
      }
    };

    dpRow.addEventListener('click', () => {
      const open = dpPanel.style.display !== 'none';
      dpPanel.style.display = open ? 'none' : 'block';
      if(!open){ calView = { y: view.year, m: view.month }; renderDpGrid(); }
    });
    modal.querySelector('#dpPrev').addEventListener('click', (e) => {
      e.stopPropagation();
      let ny = calView.y, nm = calView.m - 1;
      if(nm < 0){ nm = 11; ny--; }
      calView.y = ny; calView.m = nm;
      renderDpGrid();
    });
    modal.querySelector('#dpNext').addEventListener('click', (e) => {
      e.stopPropagation();
      let ny = calView.y, nm = calView.m + 1;
      if(nm > 11){ nm = 0; ny++; }
      calView.y = ny; calView.m = nm;
      renderDpGrid();
    });

    let sign = 1;
    signBtn.addEventListener('click', () => {
      sign = -sign;
      signBtn.textContent = sign === 1 ? '+' : '−';
      signBtn.classList.toggle('minus', sign === -1);
      valIn.focus();
    });

    const tags = progressTags(p);
    const chipRow = modal.querySelector('#tagChips');
    tags.slice(0, 8).forEach(t => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = t;
      chip.addEventListener('click', (e) => { e.preventDefault(); tagIn.value = t; });
      chipRow.appendChild(chip);
    });

    modal.querySelector('#btnCancel').addEventListener('click', closeModal);
    modal.querySelector('#btnOk').addEventListener('click', () => {
      const raw = parseFloat(valIn.value);
      if(!raw || isNaN(raw)){ toast('请输入数量'); return; }
      const val = raw * sign;
      addProgressRecord(p.id, val, tagIn.value.trim(), selectedDate);
      closeModal();
      setTimeout(() => {
        renderProgressList();
        const el = progressListEl.querySelector(`.card[data-pid="${p.id}"]`);
        if(el) openProgressCard(p.id);
        const fresh = findProgress(p.id);
        if(fresh && isProgressDone(fresh)) coach(`「${fresh.name}」达成目标`);
      }, 200);
    });
    setTimeout(() => valIn.focus(), 320);
  });
}

function openTagDetail(tagName, silent){
  pageHost.innerHTML = '';
  const page = document.createElement('div');
  page.className = 'page';

  const records = [];
  for(const p of state.projects){
    for(const k in p.records){
      const r = p.records[k];
      if(r.tag === tagName){
        records.push({ dateKey: k, projectId: p.id, projectName: p.name, color: p.color, note: r.note || '' });
      }
    }
  }
  records.sort((a, b) => b.dateKey.localeCompare(a.dateKey));

  page.innerHTML = `
    <div class="page-nav">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        标签墙
      </button>
      <span class="page-title">${esc(tagName)}</span>
      <span style="width:64px"></span>
    </div>
    <div class="field" id="tagDetailBody"></div>
  `;
  pageHost.appendChild(page);
  const body = page.querySelector('#tagDetailBody');

  const head = document.createElement('div');
  head.className = 'tag-detail-head';
  const zhengBox = document.createElement('div');
  zhengBox.className = 'td-zheng';
  renderGlyphs(zhengBox, records.length, 'tagd'+tagName, 30);
  head.innerHTML = `<div class="td-name">${esc(tagName)}</div>`;
  head.appendChild(zhengBox);
  const sub = document.createElement('div');
  sub.className = 'td-sub';
  sub.textContent = `共 ${records.length} 笔`;
  head.appendChild(sub);
  body.appendChild(head);

  if(!records.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<div class="big">空</div><p>暂无记录</p>';
    body.appendChild(e);
  }else{
    records.forEach(r => {
      const [y, m, d] = r.dateKey.split('-').map(Number);
      const el = document.createElement('div');
      el.className = 'tag-record';
      el.innerHTML = `

          <span class="tr-proj">${esc(r.projectName)}</span>
        </div>
        <div class="tr-note ${r.note ? '' : 'empty'}">${r.note ? esc(r.note) : '（无备注）'}</div>
      `;
      el.addEventListener('click', () => { openRecordModal(r.projectId, r.dateKey); });
      body.appendChild(el);
    });
  }

  page.querySelector('#backBtn').addEventListener('click', () => {
    page.classList.remove('show');
    setTimeout(() => { if(page.parentNode === pageHost) page.remove(); openTagWall(); }, 420);
  });
  if(silent){
    page.classList.add('no-anim');
    requestAnimationFrame(() => page.classList.add('show'));
  } else {
    requestAnimationFrame(() => page.classList.add('show'));
  }

function closePageThenCallback(page, onDone){

function shareTian(stats){
  const W = 760, TOP_PAD = 40;
  const gs = 26, gap = 0;
  const perRow = Math.floor((W - 120) / (gs + gap));
  const full = Math.floor(stats.count / 5);
  const part = stats.count % 5;
  const totalGlyphs = full + (part ? 1 : 0);
  const rows = Math.max(1, Math.ceil(totalGlyphs / perRow));
  const tianHeight = rows * gs;
  let cursor = TOP_PAD;
  cursor += 40 + 40; cursor += tianHeight; cursor += 60;
  cursor += 30 + 4 + 26 + 60; cursor += 90 + 60;
  const H = cursor;
  const dpr = 2;
  const cv = document.createElement('canvas');
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const bg = '#FAF8F3', fg = '#2A2622', fg3 = '#C4BFB5';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  let cy = TOP_PAD;
  ctx.fillStyle = fg;
  ctx.font = '600 32px -apple-system,"PingFang SC",sans-serif';
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  ctx.fillText('我写下的正字', W/2, cy);
  cy += 40 + 40;
  let gx = 60, count = 0;
  const drawG = (cnt) => {
    ctx.save(); ctx.translate(gx, cy);
    ctx.strokeStyle = fg;
    ctx.lineWidth = gs / 100 * 7;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for(let s = 0; s < cnt; s++){
      const [x1,y1,x2,y2] = STROKES[s];
      ctx.beginPath();
      ctx.moveTo(x1/100*gs, y1/100*gs);
      ctx.quadraticCurveTo((x1+x2)/2/100*gs, (y1+y2)/2/100*gs, x2/100*gs, y2/100*gs);
      ctx.stroke();
    }
    ctx.restore();
  };
  for(let i = 0; i < full; i++){
    drawG(5); gx += gs + gap; count++;
    if(count % perRow === 0){ gx = 60; cy += gs + gap; }
  }
  if(part){ drawG(part); gx += gs + gap; count++; }
  cy += gs + 60;
  ctx.fillStyle = fg;
  ctx.font = '600 26px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(`坚持 ${stats.days} 天`, W/2, cy);
  cy += 30 + 4;
  ctx.fillStyle = fg3;
  ctx.font = '400 18px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(`写下了 ${full} 个正字${part > 0 ? ' + ' + part + ' 笔' : ''}`, W/2, cy);
  cy += 26 + 60;
  const qrSize = 90, qrX = 60, qrY = cy;
  ctx.fillStyle = fg3;
  ctx.font = '400 15px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('正字台', qrX + qrSize + 16, qrY + qrSize/2 - 12);
  ctx.font = '400 13px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('一笔一画，把日子写端正', qrX + qrSize + 16, qrY + qrSize/2 + 12);
  drawQRCodeAsync(ctx, 'https://xmmis1.github.io/zhengzitai/', qrX, qrY, qrSize, () => {
    cv.toBlob(async blob => {
      if(!blob) return;
      const file = new File([blob], '我写下的正字.png', { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try { await navigator.share({ files: [file], title: '我写下的正字' }); return; } catch(e){}
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }, 'image/png');
  });
}

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if(!o.projects && !o.progress) throw 0;
        if(!confirm('导入将覆盖当前所有数据，确定吗？')) return;
        state = Object.assign(clone(DEFAULT_STATE), o, {
          settings: Object.assign(clone(DEFAULT_STATE.settings), o.settings || {})
        });
        if(!Array.isArray(state.progress)) state.progress = [];
        if(!Array.isArray(state.archived)) state.archived = [];
        saveState();
        document.documentElement.setAttribute('data-theme', state.settings.theme || 'auto');
        document.documentElement.setAttribute('data-skin', state.settings.skin || 'default');
        view.openProjectId = null; openProgressId = null;
        const t = new Date();
        view.year = t.getFullYear(); view.month = t.getMonth(); view.selDate = todayKey();
        renderMain(); renderProgressList();
        toast('导入成功');
      }catch(e){ toast('文件格式不对'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

  const wrap = page.querySelector('#bigCalWrap');
  const modeToggle = page.querySelector('#modeToggle');
  const setMode = (mode) => {
    state.settings.calMode = mode; saveState();
    modeToggle.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.mode === mode); });
    renderBigCalendar(wrap);
  };
  modeToggle.querySelectorAll('button').forEach(b => { b.addEventListener('click', () => setMode(b.dataset.mode)); });
  setMode(state.settings.calMode || 'stripe');
  page.querySelector('#shareBtn').addEventListener('click', () => { openShareOptions(view.bigCalYear, view.bigCalMonth); });
  page.querySelector('#backBtn').addEventListener('click', () => {
    page.classList.remove('show');
    setTimeout(() => { if(page.parentNode === pageHost) page.remove(); }, 420);
  });
  requestAnimationFrame(() => page.classList.add('show'));
}

function renderBigCalendar(wrap){
  wrap.innerHTML = '';
  const y = view.bigCalYear, m = view.bigCalMonth;
  const mode = state.settings.calMode || 'stripe';
  const head = document.createElement('div');
  head.className = 'cal-head';
  head.innerHTML = `
    <button class="cal-nav" data-dir="-1">‹</button>
    <span class="cal-month">${y}年${m+1}月</span>
    <button class="cal-nav" data-dir="1">›</button>
  `;
  wrap.appendChild(head);
  head.querySelectorAll('.cal-nav').forEach(btn => {
    btn.addEventListener('click', () => {
      const dir = parseInt(btn.dataset.dir);
      let ny = view.bigCalYear, nm = view.bigCalMonth + dir;
      if(nm < 0){ nm = 11; ny--; }
      if(nm > 11){ nm = 0; ny++; }
      view.bigCalYear = ny; view.bigCalMonth = nm;
      renderBigCalendar(wrap);
    });
  });
  const wd = document.createElement('div');
  wd.className = 'weekdays';
  wd.innerHTML = WEEK.map(w => `<span>${w}</span>`).join('');
  wrap.appendChild(wd);
  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const dim = new Date(y, m+1, 0).getDate();
  const tk = todayKey();
  for(let i = 0; i < 42; i++){
    const d = i - startDow + 1;
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(d < 1 || d > dim){ cell.classList.add('blank'); grid.appendChild(cell); continue; }
    const key = dateKey(y, m, d);
    if(key === tk) cell.classList.add('today');
    const dEl = document.createElement('span');
    dEl.className = 'd'; dEl.textContent = d;
    cell.appendChild(dEl);
    const onProjects = projectsOnDate(key);
    if(mode === 'tian'){
      if(onProjects.length > 0){
        const cnt = Math.min(onProjects.length, 5);
        const mini = document.createElement('div');
        mini.className = 'tian-mini';
        mini.appendChild(buildGlyph(cnt, seedFromKey('day' + key, 0)));
        cell.appendChild(mini);
      }
    }else{
      if(onProjects.length > 0){
        const stripes = document.createElement('div');
        stripes.className = 'stripes';
        const maxShow = 3;
        onProjects.slice(0, maxShow).forEach(p => {
          const s = document.createElement('div');
          s.className = 'stripe';
          s.style.background = p.color;
          const txt = document.createElement('div');
          txt.className = 'stripe-txt';
          txt.textContent = p.name.length > 3 ? p.name.slice(0,3) : p.name;
          s.appendChild(txt);
          stripes.appendChild(s);
        });
        if(onProjects.length > maxShow){
          const more = document.createElement('div');
          more.className = 'more-num';
          more.textContent = '+' + (onProjects.length - maxShow);
          stripes.appendChild(more);
        }
        cell.appendChild(stripes);
      }
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
}

function drawQRCodeAsync(ctx, text, x, y, size, callback){
  const url = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=' + encodeURIComponent(text);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, y, size, size);
    ctx.drawImage(img, x, y, size, size);
    if(callback) callback();
  };
  img.onerror = () => {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, y, size, size);
    ctx.strokeStyle = '#C4BFB5';
    ctx.lineWidth = 1; ctx.strokeRect(x, y, size, size);
    ctx.fillStyle = '#8A857C';
    ctx.font = '12px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('二维码', x + size/2, y + size/2);
    if(callback) callback();
  };
  img.src = url;
}

function openShareOptions(defaultY, defaultM){
  openModal(modal => {
    modal.innerHTML = `
      <h3 class="modal-title">分享</h3>
      <div class="modal-sub">选择时间范围</div>
      <div class="group" style="background:var(--card2);margin:0">
        <div class="row" data-range="month" style="cursor:pointer"><span class="row-label">本月</span><span class="row-val">›</span></div>
        <div class="row" data-range="3m" style="cursor:pointer"><span class="row-label">近 3 个月</span><span class="row-val">›</span></div>
        <div class="row" data-range="year" style="cursor:pointer"><span class="row-label">今年以来</span><span class="row-val">›</span></div>
        <div class="row" data-range="all" style="cursor:pointer"><span class="row-label">全部</span><span class="row-val">›</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="btnCancel">取消</button>
      </div>
    `;
    modal.querySelector('#btnCancel').addEventListener('click', closeModal);
    modal.querySelectorAll('[data-range]').forEach(row => {

        const range = row.dataset.range;
        closeModal();
        setTimeout(() => shareMonth(defaultY, defaultM, range), 260);
      });
    });
  });
}

function shareMonth(y, m, range){
  range = range || 'month';
  let fromY = y, fromM = m, toY = y, toM = m;
  let label = `${y}年${m+1}月`;
  if(range === '3m'){
    const d = new Date(y, m - 2, 1);
    fromY = d.getFullYear(); fromM = d.getMonth();
    toY = y; toM = m;
    label = `${fromY}.${fromM+1} — ${toY}.${toM+1}`;
  }else if(range === 'year'){
    fromY = y; fromM = 0; toY = y; toM = 11;
    label = `${y}年`;
  }else if(range === 'all'){
    let earliest = null;
    for(const p of state.projects){
      for(const k in p.records){
        if(!earliest || k < earliest) earliest = k;
      }
    }
    if(earliest){
      const [ey, em] = earliest.split('-').map(Number);
      fromY = ey; fromM = em - 1;
    }
    label = '全部记录';
  }
  const inRange = (key) => {
    const [yy, mm] = key.split('-').map(Number);
    const ym = yy * 12 + mm;
    return ym >= fromY * 12 + (fromM+1) && ym <= toY * 12 + (toM+1);
  };
  const daySet = new Set();
  let totalCount = 0;
  for(const p of state.projects){
    for(const k in p.records){
      if(inRange(k)){ daySet.add(k); totalCount++; }
    }
  }
  const days = daySet.size;
  const projStats = [];
  state.projects.forEach(p => {
    let c = 0;
    for(const k in p.records) if(inRange(k)) c++;
    if(c > 0) projStats.push({ name: p.name, color: p.color, count: c });
  });
  const W = 760, TOP_PAD = 40;
  let cursor = TOP_PAD;
  cursor += 40 + 30; cursor += 28 + 4 + 26 + 40;
  cursor += 40 + 40; cursor += projStats.length * 32 + 40;
  const calCols = 7, calGap = 6, calCell = 60;
  const calW = calCols * calCell + (calCols - 1) * calGap;
  const calLeft = (W - calW) / 2;
  const calRows = 6;
  let calHeight = 0;
  if(range === 'month') calHeight = 30 + calRows * calCell + (calRows - 1) * calGap;
  cursor += calHeight;
  if(calHeight) cursor += 60;
  cursor += 90 + 60;
  const H = cursor;
  const dpr = 2;
  const cv = document.createElement('canvas');
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const bg = '#FAF8F3', fg = '#2A2622', fg2 = '#8A857C', fg3 = '#C4BFB5';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  let cy = TOP_PAD;
  ctx.fillStyle = fg;
  ctx.font = '600 38px -apple-system,"PingFang SC",sans-serif';
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  ctx.fillText(label, W/2, cy);
  cy += 40 + 30;
  ctx.font = '500 24px -apple-system,"PingFang SC",sans-serif';
  ctx.fillStyle = fg;
  ctx.fillText(`坚持 ${days} 天`, W/2, cy);
  cy += 28 + 4;
  ctx.fillText(`写下 ${totalCount} 笔`, W/2, cy);
  cy += 26 + 40;
  const full = Math.floor(totalCount / 5);
  const part = totalCount % 5;
  const size = 32, gap = 2;
  const maxZ = Math.min(full, 12);
  const numGlyphs = maxZ + (part && maxZ < 12 ? 1 : 0);
  const totalWidth = numGlyphs * (size + gap) - gap;
  let zx = W/2 - totalWidth / 2;
  const drawGlyph2 = (cnt, color) => {
    ctx.save(); ctx.translate(zx, cy);
    ctx.strokeStyle = color;
    ctx.lineWidth = size / 100 * 7;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for(let s = 0; s < cnt; s++){
      const [x1,y1,x2,y2] = STROKES[s];
      ctx.beginPath();
      ctx.moveTo(x1/100*size, y1/100*size);
      ctx.quadraticCurveTo((x1+x2)/2/100*size, (y1+y2)/2/100*size, x2/100*size, y2/100*size);
      ctx.stroke();
    }
    ctx.restore();
  };
  for(let i = 0; i < maxZ; i++){ drawGlyph2(5, fg); zx += size + gap; }
  if(part && maxZ < 12){ drawGlyph2(part, fg); zx += size + gap; }
  if(full > 12){
    ctx.fillStyle = fg2;
    ctx.font = '400 24px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('…', zx, cy + 4);
    ctx.textAlign = 'center';
  }
  cy += 40 + 40;
  ctx.font = '400 18px -apple-system,"PingFang SC",sans-serif';
  projStats.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.textAlign = 'left';
    ctx.fillText(p.name, 100, cy);
    ctx.textAlign = 'right';
    ctx.fillStyle = fg2;
    ctx.fillText(p.count + ' 次', W - 100, cy);
    cy += 32;
  });
  cy += 40;
  if(range === 'month'){
    const mode = state.settings.calMode || 'stripe';
    const first = new Date(y, m, 1);
    const startDow = (first.getDay() + 6) % 7;
    const dim = new Date(y, m+1, 0).getDate();
    ctx.fillStyle = fg3;
    ctx.font = '400 16px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    WEEK.forEach((w, i) => {
      ctx.fillText(w, calLeft + i*(calCell+calGap) + calCell/2, cy);
    });
    const gridY = cy + 30;
    for(let i = 0; i < 42; i++){
      const d = i - startDow + 1;
      const col = i % 7, row = Math.floor(i / 7);
      const x = calLeft + col*(calCell+calGap);
      const yy = gridY + row*(calCell+calGap);
      if(d < 1 || d > dim) continue;
      const key = dateKey(y, m, d);
      const onProjects = projectsOnDate(key);
      ctx.fillStyle = '#F0EBE1';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x, yy, calCell, calCell, 12);
      else ctx.rect(x, yy, calCell, calCell);
      ctx.fill();
      ctx.fillStyle = fg3;
      ctx.font = '400 14px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(d, x + calCell/2, yy + 6);
      if(mode === 'tian' && onProjects.length > 0){
        const cnt = Math.min(onProjects.length, 5);
        const gs = calCell * 0.6;
        const gx2 = x + calCell/2 - gs/2;
        const gy2 = yy + calCell*0.32;
        ctx.save(); ctx.translate(gx2, gy2);
        ctx.strokeStyle = fg;
        ctx.lineWidth = gs / 100 * 7;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for(let s = 0; s < cnt; s++){
          const [x1,y1,x2,y2] = STROKES[s];
          ctx.beginPath();
          ctx.moveTo(x1/100*gs, y1/100*gs);
          ctx.quadraticCurveTo((x1+x2)/2/100*gs, (y1+y2)/2/100*gs, x2/100*gs, y2/100*gs);
          ctx.stroke();
        }
        ctx.restore();
      }
      if(mode === 'stripe' && onProjects.length > 0){
        const maxShow = 3, sh = 10;
        const sy = yy + calCell*0.38;
        onProjects.slice(0, maxShow).forEach((p, idx) => {
          const ry = sy + idx*(sh + 2);
          if(ry + sh > yy + calCell - 4) return;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          if(ctx.roundRect) ctx.roundRect(x + 4, ry, calCell - 8, sh, 3);
          else ctx.rect(x + 4, ry, calCell - 8, sh);
          ctx.fill();
        });
        if(onProjects.length > maxShow){
          ctx.fillStyle = fg2;
          ctx.font = '400 10px -apple-system,"PingFang SC",sans-serif';
          ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
          ctx.fillText('+' + (onProjects.length - maxShow), x + calCell - 5, yy + calCell - 4);
        }
      }
    }
    cy += calHeight + 60;
  }
  const qrSize = 90, qrX = 60, qrY = cy;
  ctx.fillStyle = fg3;
  ctx.font = '400 15px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('正字台', qrX + qrSize + 16, qrY + qrSize/2 - 12);
  ctx.font = '400 13px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('一笔一画，把日子写端正', qrX + qrSize + 16, qrY + qrSize/2 + 12);
  drawQRCodeAsync(ctx, 'https://xmmis1.github.io/zhengzitai/', qrX, qrY, qrSize, () => {
    cv.toBlob(async blob => {
      if(!blob) return;
      const file = new File([blob], `正字台-${y}${pad2(m+1)}.png`, { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try { await navigator.share({ files: [file], title: label }); return; } catch(e){}
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }, 'image/png');
  });
}

let dragState = null;
function bindDragSort(container, kind){
  const cards = $$('.card', container);
  if(cards.length < 2) return;

  const onStart = (e) => {
    if(dragState) return;
    const card = e.target.closest('.card');
    if(!card) return;
    if(e.target.closest('button')) return;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    dragState = {
      card, container, kind,
      startY: clientY, startX: clientX,
      active: false,
      longPressTimer: setTimeout(() => {
        if(!dragState || dragState.card !== card) return;
        startDrag(clientY, clientX);
      }, 300)
    };
  };
  const onMove = (e) => {
    if(!dragState || !dragState.active) return;
    e.preventDefault();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    moveDrag(clientY);
  };
  const onEnd = () => {
    if(!dragState) return;
    clearTimeout(dragState.longPressTimer);
    if(!dragState.active){ dragState = null; return; }
    endDrag();
  };
  const onCancelMove = (e) => {
    if(!dragState || dragState.active) return;
    const y = e.touches[0].clientY, x = e.touches[0].clientX;
    if(Math.hypot(y - dragState.startY, x - dragState.startX) > 10){
      clearTimeout(dragState.longPressTimer);
      dragState = null;
    }
  };
  cards.forEach(card => {
    card.addEventListener('touchstart', onStart, { passive: true });
    card.addEventListener('mousedown', onStart);
    card.addEventListener('touchmove', onCancelMove, { passive: true });
    card.addEventListener('touchend', onEnd, { passive: true });
    card.addEventListener('mouseup', onEnd);
  });

  const startDrag = (clientY, clientX) => {
    if(!dragState) return;
    const el = dragState.card;
    if(kind === 'project' && view.openProjectId) closeCard();
    if(kind === 'progress' && openProgressId) closeProgressCard();
    dragState.active = true;
    dragState.startY = clientY;
    dragState.placeholder = document.createElement('div');
    dragState.placeholder.className = 'drag-placeholder';
    dragState.placeholder.style.height = el.offsetHeight + 'px';
    dragState.placeholder.style.marginBottom = '11px';
    el.parentNode.insertBefore(dragState.placeholder, el);
    const rect = el.getBoundingClientRect();
    el.style.width = rect.width + 'px';
    el.style.position = 'fixed';
    el.style.top = rect.top + 'px';
    el.style.left = rect.left + 'px';
    el.style.margin = '0';
    el.classList.add('dragging');
    document.body.appendChild(el);
    if(navigator.vibrate) navigator.vibrate(10);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
  };
  const moveDrag = (clientY) => {
    if(!dragState || !dragState.active) return;
    const el = dragState.card;
    const delta = clientY - dragState.startY;
    el.style.transform = `translateY(${delta}px)`;
    const ph = dragState.placeholder;
    const siblings = $$('.card', dragState.container).filter(x => x !== el);
    const dragRect = el.getBoundingClientRect();
    const dragMid = dragRect.top + dragRect.height / 2;
    let target = null;
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      const mid = r.top + r.height / 2;
      if(dragMid < mid){ target = sib; break; }
    }
    const addCard = dragState.container.querySelector('.add-card');
    if(target) dragState.container.insertBefore(ph, target);
    else if(addCard) dragState.container.insertBefore(ph, addCard);
  };
  const endDrag = () => {
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    if(!dragState || !dragState.active) return;
    const el = dragState.card;
    const ph = dragState.placeholder;
    const container = dragState.container;
    el.style.position = ''; el.style.top = ''; el.style.left = '';
    el.style.width = ''; el.style.transform = ''; el.style.margin = '';
    el.classList.remove('dragging');
    if(ph.parentNode) ph.parentNode.insertBefore(el, ph);
    if(ph.parentNode) ph.parentNode.removeChild(ph);
    const ids = $$('.card', container).map(c => c.dataset.id || c.dataset.pid).filter(Boolean);
    if(dragState.kind === 'project'){
      const map = {};
      state.projects.forEach(p => { map[p.id] = p; });
      state.projects = ids.map(id => map[id]).filter(Boolean);
    }else{
      const map = {};
      state.progress.forEach(p => { map[p.id] = p; });
      state.progress = ids.map(id => map[id]).filter(Boolean);
    }
    saveState();
    const k = dragState.kind;
    dragState = null;
    if(k === 'project') renderProjectList();
    else renderProgressList();
  };
}

function init(){
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'auto');
  document.documentElement.setAttribute('data-skin', state.settings.skin || 'default');

  $('#btnTagWall').addEventListener('click', () => openTagWall());
  $('#btnCalendar').addEventListener('click', () => {
    view.bigCalYear = view.year; view.bigCalMonth = view.month;
    openBigCalendar();
  });
  $('#btnSettings').addEventListener('click', openSettings);

  $('#datePrev').addEventListener('click', () => changeDate(-1));
  $('#dateNext').addEventListener('click', () => changeDate(1));
  $('#btnToday').addEventListener('click', goToday);

  $$('.tab-item').forEach(b => {
    b.addEventListener('click', () => setTab(b.dataset.tab));
  });

  window.addEventListener('scroll', () => {
    $('#nav').classList.toggle('scrolled', window.scrollY > 4);
  }, { passive: true });

  renderMain();
  renderProgressList();

  // 首次引导：先选模板，再弹操作指引
  if(!state.settings.onboarded){
    setTimeout(() => {
      openTemplatePage(() => {
        if(!state.settings.onboarded){
          state.settings.onboarded = true;
          saveState();
          setTimeout(() => {
            const hasProjects = state.projects.length > 0;
            showOnboardMask({
              title: hasProjects ? '开始记录' : '建一个项目',
              desc: hasProjects
                ? '点击卡片上的「记一笔」，写下今天的第一笔。'
                : '点击「＋ 新建坚持」，建一个项目开始。',
              buttons: [{ label: '知道了', primary: true }]
            });
          }, 600);
        }
      });
    }, 400);
  }
}
