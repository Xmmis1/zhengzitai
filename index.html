  grid.appendChild(frag);

  page.querySelector('#shareBtn').addEventListener('click', () => {
    shareTian(stats);
  });
  page.querySelector('#backBtn').addEventListener('click', () => {
    page.classList.remove('show');
    setTimeout(() => { if(page.parentNode === pageHost) page.remove(); openSettings(); }, 420);
  });
  requestAnimationFrame(() => page.classList.add('show'));
}

function shareTian(stats){
  const W = 760, H = 1100;
  const dpr = 2;
  const cv = document.createElement('canvas');
  cv.width = W * dpr;
  cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (document.documentElement.getAttribute('data-theme') === 'auto' && window.matchMedia('(prefers-color-scheme:dark)').matches);

  const bg = isDark ? '#1A1815' : '#FAF8F3';
  const fg = isDark ? '#E8E2D6' : '#2A2622';
  const fg3 = isDark ? '#4A4640' : '#C4BFB5';
  const seal = '#B14B3A';

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = fg;
  ctx.font = '600 32px -apple-system,"PingFang SC",sans-serif';
  ctx.textBaseline = 'top';
  const t = '我写下的正字';
  ctx.fillText(t, W/2 - ctx.measureText(t).width/2, 60);

  /* 正字田 */
  const full = Math.floor(stats.count / 5);
  const part = stats.count % 5;
  const gs = 26;
  const gap = 0;
  const perRow = Math.floor((W - 120) / (gs + gap));
  const maxRows = 18;
  const maxGlyphs = perRow * maxRows;
  const showFull = Math.min(full, Math.floor((maxGlyphs - (part ? 1 : 0))));

  let gx = 60, gy = 130;
  const drawG = (cnt) => {
    ctx.save();
    ctx.translate(gx, gy);
    ctx.strokeStyle = fg;
    ctx.lineWidth = gs / 100 * 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for(let s = 0; s < cnt; s++){
      const [x1,y1,x2,y2] = STROKES[s];
      ctx.beginPath();
      ctx.moveTo(x1/100*gs, y1/100*gs);
      ctx.quadraticCurveTo((x1+x2)/2/100*gs, (y1+y2)/2/100*gs, x2/100*gs, y2/100*gs);
      ctx.stroke();
    }
    ctx.restore();
  };

  let count = 0;
  for(let i = 0; i < showFull; i++){
    drawG(5);
    gx += gs + gap;
    count++;
    if(count % perRow === 0){ gx = 60; gy += gs + gap; }
  }
  if(part && count < maxGlyphs){
    drawG(part);
  }

  /* 底部数字 */
  ctx.fillStyle = fg;
  ctx.font = '600 30px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  const line1 = `坚持 ${stats.days} 天`;
  ctx.fillText(line1, W/2, H - 180);
  ctx.fillStyle = fg3;
  ctx.font = '400 20px -apple-system,"PingFang SC",sans-serif';
  const line2 = `写下了 ${full} 个正字${part > 0 ? ' + ' + part + ' 笔' : ''}`;
  ctx.fillText(line2, W/2, H - 140);
  ctx.textAlign = 'left';

  /* 印章 */
  const sealSize = 56;
  const sx = W/2 - sealSize/2;
  const sy = H - 100;
  ctx.strokeStyle = seal;
  ctx.lineWidth = 2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(sx, sy, sealSize, sealSize, 4);
  else ctx.rect(sx, sy, sealSize, sealSize);
  ctx.stroke();
  ctx.fillStyle = seal;
  ctx.font = '500 20px "STKaiti","KaiTi","Songti SC",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('正', sx + sealSize/2, sy + 16);
  ctx.fillText('字', sx + sealSize/2, sy + 40);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  cv.toBlob(async blob => {
    if(!blob) return;
    const file = new File([blob], '我写下的正字.png', { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: '我写下的正字' }); return; } catch(e){}
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }, 'image/png');
}

/* ============================================================
   垃圾桶
   ============================================================ */
function openTrash(onCount){
  pageHost.innerHTML = '';
  const page = document.createElement('div');
  page.className = 'page';
  page.innerHTML = `
    <div class="page-nav">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        设置
      </button>
      <span class="page-title">垃圾桶</span>
      <span style="width:64px"></span>
    </div>
    <div class="field" id="trashBody"></div>
  `;
  pageHost.appendChild(page);
  const body = page.querySelector('#trashBody');

  const render = () => {
    body.innerHTML = '';
    if(!state.trash.length){
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div class="big">空</div><p>垃圾桶是空的</p>';
      body.appendChild(e);
      if(onCount) onCount(0);
      return;
    }
    const g = document.createElement('div');
    g.className = 'group';
    state.trash.forEach((item, i) => {
      const data = item.data || item;
      const name = data.name || '未命名';
      const color = data.color || '#999';
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <span class="dot" style="background:${color};margin:0"></span>
          <div style="min-width:0">
            <div class="row-label" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
            <div class="row-sub">${item.kind === 'progress' ? '进度' : '坚持'} · ${new Date(item.deletedAt).toLocaleDateString('zh-CN')}</div>
          </div>
        </div>
        <button class="icon-btn" data-r="${i}" style="background:var(--cell);width:auto;padding:0 12px;font-size:13px;border-radius:14px;color:var(--accent)">恢复</button>
        <button class="icon-btn" data-d="${i}" style="background:var(--cell);color:var(--danger);width:auto;padding:0 12px;font-size:13px;border-radius:14px">彻底删除</button>
      `;
      g.appendChild(row);
    });
    body.appendChild(g);

    body.querySelectorAll('[data-r]').forEach(b => {
      b.addEventListener('click', () => {
        const i = +b.dataset.r;
        const item = state.trash[i];
        if(item.kind === 'progress') state.progress.push(item.data);
        else state.projects.push(item.data);
        state.trash.splice(i, 1);
        saveState(); renderMain(); render();
        if(onCount) onCount(state.trash.length);
      });
    });
    body.querySelectorAll('[data-d]').forEach(b => {
      b.addEventListener('click', () => {
        if(!confirm('彻底删除后无法恢复，确定吗？')) return;
        state.trash.splice(+b.dataset.d, 1);
        saveState(); render();
        if(onCount) onCount(state.trash.length);
      });
    });
  };
  render();

  page.querySelector('#backBtn').addEventListener('click', () => {
    page.classList.remove('show');
    setTimeout(() => { if(page.parentNode === pageHost) page.remove(); openSettings(); }, 420);
  });
  requestAnimationFrame(() => page.classList.add('show'));
}

/* ============================================================
   导出 / 导入
   ============================================================ */
function exportData(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const file = new File([blob], `正字台备份-${todayKey()}.json`, { type: 'application/json' });
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file], title: '正字台备份' }).catch(() => {});
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('已导出');
}

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if(!o.projects && !o.progress) throw 0;
        if(!confirm('导入将覆盖当前所有数据，确定吗？')) return;
        state = Object.assign(clone(DEFAULT_STATE), o, {
          settings: Object.assign(clone(DEFAULT_STATE.settings), o.settings || {})
        });
        if(!Array.isArray(state.progress)) state.progress = [];
        saveState();
        document.documentElement.setAttribute('data-theme', state.settings.theme || 'auto');
        view.openProjectId = null;
        openProgressId = null;
        const t = new Date();
        view.year = t.getFullYear();
        view.month = t.getMonth();
        view.selDate = todayKey();
        renderMain();
        renderProgressList();
        toast('导入成功');
      }catch(e){ toast('文件格式不对'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   初始化
   ============================================================ */
function init(){
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'auto');

  $('#btnCalendar').addEventListener('click', () => {
    view.bigCalYear = view.year;
    view.bigCalMonth = view.month;
    openBigCalendar();
  });
  $('#btnSettings').addEventListener('click', openSettings);

  $('#datePrev').addEventListener('click', () => changeDate(-1));
  $('#dateNext').addEventListener('click', () => changeDate(1));
  $('#btnToday').addEventListener('click', goToday);

  $$('.tab-item').forEach(b => {
    b.addEventListener('click', () => setTab(b.dataset.tab));
  });

  window.addEventListener('scroll', () => {
    $('#nav').classList.toggle('scrolled', window.scrollY > 4);
  }, { passive: true });

  renderMain();
  renderProgressList();

  /* 首屏引导：第一次打开 */
  if(!state.settings.hintCalendar){
    setTimeout(() => coach('点右下角「记一笔」，开始写第一笔'), 600);
  }
}

init();
</script>
